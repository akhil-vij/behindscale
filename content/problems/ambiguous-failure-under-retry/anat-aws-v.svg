<svg class="anat anat-v" viewBox="0 0 360 420" role="img" aria-label="AWS: ClientToken from the caller or SDK, token and changes committed as one ACID unit, retries get a same-meaning success; a reused token with changed parameters is refused" xmlns="http://www.w3.org/2000/svg">
  <path class="replay" d="M 90 144 C 40 116, 40 62, 78 34"></path>
  <polygon class="rhead" points="90,34 78,28 78,40"></polygon>
  <rect class="node" x="90" y="10" width="180" height="48" rx="7"></rect>
  <text class="nlabel" x="180" y="30">CALLER / SDK</text>
  <text class="nsub" x="180" y="44">SDK fills the token in</text>
  <circle class="keydot" cx="180" cy="58" r="6"></circle>
  <line class="arrow" x1="180" y1="66" x2="180" y2="79"></line>
  <line class="arrow" x1="180" y1="97" x2="180" y2="110"></line>
  <polygon class="ahead" points="180,118 176,110 184,110"></polygon>
  <text class="alabel" x="180" y="88">ClientToken</text>
  <rect class="node" x="90" y="120" width="180" height="48" rx="7"></rect>
  <text class="nlabel" x="180" y="148">EC2</text>
  <line class="drop" x1="180" y1="168" x2="180" y2="188"></line>
  <line class="drop" x1="180" y1="210" x2="180" y2="218"></line>
  <text class="rlabel" x="180" y="198">SAME-MEANING SUCCESS, EVERY TIME</text>
  <rect class="acid" x="86" y="224" width="188" height="56" rx="8"></rect>
  <rect class="state" x="94" y="230" width="164" height="20" rx="5"></rect>
  <text class="slabel" x="176" y="243">TOKEN + PARAMS</text>
  <rect class="state" x="94" y="254" width="164" height="20" rx="5"></rect>
  <text class="slabel" x="176" y="267">THE CHANGES</text>
  <line class="arrow" x1="180" y1="280" x2="180" y2="296"></line>
  <line class="arrow" x1="180" y1="316" x2="180" y2="322"></line>
  <polygon class="ahead" points="180,330 176,322 184,322"></polygon>
  <text class="alabel" x="180" y="308">ONE ALL-OR-NOTHING COMMIT</text>
  <rect class="node" x="76" y="330" width="208" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="362">INSTANCE</text>
  <line class="bx" x1="100" y1="402" x2="112" y2="414"></line>
  <line class="bx" x1="112" y1="402" x2="100" y2="414"></line>
  <text class="blabel" x="120" y="412">SAME TOKEN, NEW PARAMS → REFUSED</text>
</svg>