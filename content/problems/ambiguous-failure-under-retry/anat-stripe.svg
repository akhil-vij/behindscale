  <rect class="node" x="250" y="60" width="140" height="52" rx="7"></rect>
  <text class="nlabel" x="320" y="91">STRIPE API</text>
  <line class="drop" x1="320" y1="112" x2="320" y2="124"></line>
  <rect class="state" x="248" y="124" width="144" height="26" rx="6"></rect>
  <text class="slabel" x="320" y="141">KEY → MEMORY STORE</text>
  <line class="arrow" x1="390" y1="86" x2="496" y2="86"></line>
  <polygon class="ahead" points="504,86 496,82 496,90"></polygon>
  <rect class="node" x="506" y="60" width="126" height="52" rx="7"></rect>
  <text class="nlabel" x="569" y="91">CHARGE</text>
  <line class="bx" x1="52" y1="170" x2="64" y2="182"></line>
  <line class="bx" x1="64" y1="170" x2="52" y2="182"></line>
  <text class="blabel" x="72" y="180">REUSED KEY = OLD RESPONSE, SILENTLY</text>
</svg>