<svg class="anat" viewBox="0 0 640 190" role="img" aria-label="Stripe: key made by the caller, memory in a store on the server, retries get the saved response. Breaks when the caller reuses a key" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <path class="replay" d="M 300 60 C 256 20, 140 20, 98 56"></path>
  <polygon class="rhead" points="92,58 102,52 102,60"></polygon>
  <text class="rlabel" x="196" y="16">RETRY GETS THE SAVED RESPONSE</text>
  <rect class="node" x="8" y="60" width="108" height="52" rx="7"></rect>
  <text class="nlabel" x="62" y="91">CALLER</text>
  <circle class="keydot" cx="116" cy="86" r="6.5"></circle>
  <line class="arrow" x1="126" y1="86" x2="240" y2="86"></line>
  <polygon class="ahead" points="248,86 240,82 240,90"></polygon>
