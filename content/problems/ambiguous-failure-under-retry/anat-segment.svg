  <rect class="node" x="8" y="60" width="108" height="52" rx="7"></rect>
  <text class="nlabel" x="62" y="77">PHONE</text>
  <text class="nsub" x="62" y="91">out of</text>
  <text class="nsub" x="62" y="105">its control</text>
