<svg class="anat" viewBox="0 0 640 190" role="img" aria-label="Airbnb: key made by the caller, memory on the main database only, retries get the saved response. A read-only copy that runs behind would cause a double charge" xmlns="http://www.w3.org/2000/svg">
  <path class="replay" d="M 300 60 C 256 20, 140 20, 98 56"></path>
  <polygon class="rhead" points="92,58 102,52 102,60"></polygon>
  <text class="rlabel" x="196" y="16">RETRY GETS THE SAVED RESPONSE</text>
  <rect class="node" x="8" y="60" width="108" height="52" rx="7"></rect>
  <text class="nlabel" x="62" y="91">CALLER</text>
  <circle class="keydot" cx="116" cy="86" r="6.5"></circle>
  <line class="arrow" x1="126" y1="86" x2="240" y2="86"></line>
  <polygon class="ahead" points="248,86 240,82 240,90"></polygon>
  <text class="alabel" x="183" y="66">SAME KEY,</text>
  <text class="alabel" x="183" y="78">EVERY RETRY</text>
  <rect class="node" x="250" y="60" width="140" height="52" rx="7"></rect>
  <text class="nlabel" x="320" y="77">ORPHEUS</text>
  <text class="nsub" x="320" y="91">library inside</text>
  <text class="nsub" x="320" y="105">the service</text>
  <line class="drop" x1="320" y1="112" x2="320" y2="124"></line>
  <rect class="state" x="248" y="124" width="144" height="26" rx="6"></rect>
  <text class="slabel" x="320" y="141">MAIN DATABASE ONLY</text>
  <rect class="state faded" x="404" y="124" width="114" height="26" rx="6"></rect>
  <text class="slabel faded" x="461" y="141">READ-ONLY COPY</text>
  <line class="arrow" x1="390" y1="86" x2="496" y2="86"></line>
  <polygon class="ahead" points="504,86 496,82 496,90"></polygon>
  <rect class="node" x="506" y="60" width="126" height="52" rx="7"></rect>
  <text class="nlabel" x="569" y="91">BANK</text>
  <line class="bx" x1="52" y1="170" x2="64" y2="182"></line>
  <line class="bx" x1="64" y1="170" x2="52" y2="182"></line>
  <text class="blabel" x="72" y="180">SECONDS BEHIND = DOUBLE CHARGE</text>
