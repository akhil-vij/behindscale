<svg class="anat" id="you-svg" viewBox="0 0 640 224" role="img" aria-label="Your design on the same skeleton: caller, server, memory, bank, drawn from your decisions after a survived day" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g id="you-fill">
  <path class="replay" d="M 300 60 C 256 20, 140 20, 98 56"></path>
  <polygon class="rhead" points="92,58 102,52 102,60"></polygon>
  <text class="rlabel" x="196" y="16" id="you-d-rep">{{dRep}}</text>
  <rect class="node" x="8" y="60" width="108" height="52" rx="7"></rect>
  <text class="nlabel" x="62" y="91">CALLER</text>
  <circle class="keydot" cx="116" cy="86" r="6.5"></circle>
  <text class="klabel" x="116" y="128" id="you-d-key">{{dKey}}</text>
  <line class="arrow" x1="126" y1="86" x2="240" y2="86"></line>
  <polygon class="ahead" points="248,86 240,82 240,90"></polygon>
  <rect class="node" x="250" y="60" width="140" height="52" rx="7"></rect>
  <text class="nlabel" x="320" y="91">SERVER</text>
  <line class="drop" x1="320" y1="112" x2="320" y2="124"></line>
  <rect class="state" x="214" y="124" width="212" height="54" rx="6"></rect>
  <text class="slabel" id="you-d-state" x="320" y="136" data-wrap="25" data-lines="3" data-line-height="15">{{dState}}</text>
  <line class="arrow" x1="390" y1="86" x2="496" y2="86"></line>
  <polygon class="ahead" points="504,86 496,82 496,90"></polygon>
  <rect class="node" x="506" y="60" width="126" height="52" rx="7"></rect>
  <text class="nlabel" x="569" y="91">BANK</text>
  <line class="bx" x1="52" y1="194" x2="64" y2="206"></line>
  <line class="bx" x1="64" y1="194" x2="52" y2="206"></line>
  <text class="blabel" id="you-d-breaks" x="72" y="204" data-wrap="75" data-lines="2" data-line-height="15">{{dBreaks}}</text>
  </g>
</svg>