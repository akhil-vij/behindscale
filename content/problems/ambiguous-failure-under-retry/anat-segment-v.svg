<svg class="anat anat-v" viewBox="0 0 360 412" role="img" aria-label="Segment: messageId made by the caller's SDK, memory in a RocksDB ledger on each worker, duplicates are silently dropped. The window shrinks under heavy traffic" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <path class="replay none" d="M 72 156 C 22 128, 22 52, 60 36"></path>
  <line class="rstop" x1="64" y1="30" x2="64" y2="42"></line>
  <rect class="node" x="72" y="10" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="33">PHONE</text>
  <text class="nsub" x="180" y="52">out of its control</text>
  <circle class="keydot" cx="180" cy="66" r="6.5"></circle>
  <line class="arrow" x1="180" y1="76" x2="180" y2="84"></line>
  <line class="arrow" x1="180" y1="106" x2="180" y2="116"></line>
