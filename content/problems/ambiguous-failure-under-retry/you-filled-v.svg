<svg class="anat anat-v" viewBox="0 0 360 420" role="img" aria-label="Your design on the same skeleton: client, server, memory, bank - drawn from your decisions after a survived day" xmlns="http://www.w3.org/2000/svg">
  <path class="replay" d="M 90 144 C 40 116, 40 62, 78 34"></path>
  <polygon class="rhead" points="90,34 78,28 78,40"></polygon>
  <rect class="node" x="90" y="10" width="180" height="48" rx="7"></rect>
  <text class="nlabel" x="180" y="38">CLIENT</text>
  <circle class="keydot" cx="180" cy="58" r="6"></circle>
  <line class="arrow" x1="180" y1="66" x2="180" y2="79"></line>
  <line class="arrow" x1="180" y1="97" x2="180" y2="110"></line>
  <polygon class="ahead" points="180,118 176,110 184,110"></polygon>
  <text class="klabel" id="you-d-key-v" x="180" y="88">{{dKey}}</text>
  <rect class="node" x="90" y="120" width="180" height="48" rx="7"></rect>
  <text class="nlabel" x="180" y="148">SERVER</text>
  <line class="drop" x1="180" y1="168" x2="180" y2="188"></line>
  <line class="drop" x1="180" y1="210" x2="180" y2="224"></line>
  <text class="rlabel" id="you-d-rep-v" x="180" y="198">{{dRep}}</text>
  <rect class="state" x="90" y="230" width="180" height="30" rx="6"></rect>
  <text class="slabel" id="you-d-state-v" x="180" y="249">{{dState}}</text>
  <line class="arrow" x1="180" y1="260" x2="180" y2="322"></line>
  <polygon class="ahead" points="180,330 176,322 184,322"></polygon>
  <rect class="node" x="76" y="330" width="208" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="362">BANK</text>
  <line class="bx" x1="100" y1="402" x2="112" y2="414"></line>
  <line class="bx" x1="112" y1="402" x2="100" y2="414"></line>
  <text class="blabel" id="you-d-breaks-v" x="120" y="412">{{dBreaks}}</text>
</svg>