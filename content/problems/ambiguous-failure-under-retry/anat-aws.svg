  <rect class="node" x="8" y="60" width="108" height="52" rx="7"></rect>
  <text class="nlabel" x="62" y="77">CALLER / SDK</text>
  <text class="nsub" x="62" y="91">SDK fills the</text>
  <text class="nsub" x="62" y="105">token in</text>
  <circle class="keydot" cx="116" cy="86" r="6.5"></circle>
  <line class="arrow" x1="126" y1="86" x2="240" y2="86"></line>
  <polygon class="ahead" points="248,86 240,82 240,90"></polygon>
  <text class="alabel" x="183" y="78">ClientToken</text>
  <rect class="node" x="250" y="60" width="140" height="52" rx="7"></rect>
  <text class="nlabel" x="320" y="91">EC2</text>
  <line class="drop" x1="320" y1="112" x2="320" y2="120"></line>
  <rect class="acid" x="248" y="120" width="272" height="44" rx="8"></rect>
  <rect class="state" x="256" y="125" width="116" height="20" rx="5"></rect>
  <text class="slabel" x="314" y="139">TOKEN + PARAMS</text>
  <rect class="state" x="380" y="125" width="132" height="20" rx="5"></rect>
  <text class="slabel" x="446" y="139">THE CHANGES</text>
  <text class="alabel" x="384" y="159">ONE ALL-OR-NOTHING COMMIT</text>
  <line class="arrow" x1="390" y1="86" x2="496" y2="86"></line>
  <polygon class="ahead" points="504,86 496,82 496,90"></polygon>
  <rect class="node" x="506" y="60" width="126" height="52" rx="7"></rect>
  <text class="nlabel" x="569" y="91">INSTANCE</text>
  <line class="bx" x1="52" y1="170" x2="64" y2="182"></line>
  <line class="bx" x1="64" y1="170" x2="52" y2="182"></line>
  <text class="blabel" x="72" y="180">SAME TOKEN, NEW PARAMS → REFUSED</text>
</svg>