<svg class="anat" viewBox="0 0 640 190" role="img" aria-label="AWS: ClientToken from the caller or its SDK, token and changes saved in one all-or-nothing commit, retries get a success every time. A reused token with changed parameters is refused" xmlns="http://www.w3.org/2000/svg">
  <path class="replay" d="M 300 60 C 256 20, 140 20, 98 56"></path>
  <polygon class="rhead" points="92,58 102,52 102,60"></polygon>
