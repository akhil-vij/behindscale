<svg class="anat anat-v" viewBox="0 0 360 496" role="img" aria-label="Slack: the backlog lives in Redis memory, then Kafka in front. What slows as it fills: the old queue, taking a job out slowed and needed free memory. When full: nobody, a rate-limited relay. Still breaks: not listed, Kafka keeps two days." xmlns="http://www.w3.org/2000/svg">
  <line class="replay none" x1="72" y1="152" x2="48" y2="152"></line>
  <line class="rstop" x1="48" y1="142" x2="48" y2="162"></line>
  <rect class="node" x="72" y="10" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="33">SENDERS</text>
  <text class="nsub" x="180" y="52">THE WEB APP</text>
  <line class="arrow" x1="180" y1="66" x2="180" y2="74"></line>
  <text class="rlabel none" x="180" y="97">NOBODY: A RATE-LIMITED RELAY</text>
  <line class="arrow" x1="180" y1="112" x2="180" y2="118"></line>
  <polygon class="ahead" points="180,124 176,118 184,118"></polygon>
  <rect class="node" x="72" y="124" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="147">THE QUEUE</text>
  <text class="nsub" x="180" y="166">KAFKAGATE · JQRELAY</text>
  <line class="drop" x1="180" y1="180" x2="180" y2="192"></line>
  <rect class="state" x="41" y="192" width="279" height="30" rx="6"></rect>
  <text class="slabel" x="180" y="211">REDIS MEMORY, THEN KAFKA IN FRONT</text>
  <circle class="keydot" cx="55" cy="240" r="5"></circle>
  <text class="klabel" x="180" y="244">OLD: TAKING A JOB OUT SLOWED,</text>
  <text class="klabel" x="180" y="260">NEEDED FREE MEMORY</text>
  <rect class="node" x="72" y="282" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="315">WORKERS</text>
  <line class="arrow" x1="180" y1="338" x2="180" y2="374"></line>
  <polygon class="ahead" points="180,382 176,374 184,374"></polygon>
  <rect class="node" x="72" y="386" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="409">DOWNSTREAM</text>
  <text class="nsub" x="180" y="428">WORKERS, THEN DB</text>
  <line class="bx" x1="24" y1="454" x2="36" y2="466"></line>
  <line class="bx" x1="36" y1="454" x2="24" y2="466"></line>
  <text class="blabel" x="44" y="464">NOT LISTED · KAFKA KEEPS 2 DAYS</text>
</svg>