<svg class="anat anat-v" viewBox="0 0 360 496" role="img" aria-label="Segment: the backlog lives in MySQL rows, one database per owner. What slows as it fills: nothing, few jobs in use, databases replaced about every 30 minutes. When full: the partner, 100,000 a second against a normal 16,000. Still breaks: its retries pile onto the partner." xmlns="http://www.w3.org/2000/svg">
  <path class="replay" d="M 72 152 C 24 200, 24 380, 66 414"></path>
  <polygon class="rhead" points="72,414 63,409 63,419"></polygon>
  <rect class="node" x="72" y="10" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="33">SENDERS</text>
  <text class="nsub" x="180" y="52">42,000 SOURCES</text>
  <line class="arrow" x1="180" y1="66" x2="180" y2="74"></line>
  <text class="rlabel" x="180" y="88">THE PARTNER: 100,000/S</text>
  <text class="rlabel" x="180" y="104">AGAINST A NORMAL 16,000</text>
  <line class="arrow" x1="180" y1="112" x2="180" y2="118"></line>
  <polygon class="ahead" points="180,124 176,118 184,118"></polygon>
  <rect class="node" x="72" y="124" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="147">THE QUEUE</text>
  <text class="nsub" x="180" y="166">CENTRIFUGE</text>
  <line class="drop" x1="180" y1="180" x2="180" y2="192"></line>
  <rect class="state" x="59" y="192" width="242" height="30" rx="6"></rect>
  <text class="slabel" x="180" y="211">MYSQL ROWS · ONE DB PER OWNER</text>
  <circle class="keydot" cx="71" cy="240" r="5"></circle>
  <text class="klabel" x="180" y="244">NOTHING: FEW JOBS IN USE,</text>
  <text class="klabel" x="180" y="260">DBS REPLACED ~30 MIN</text>
  <rect class="node" x="72" y="282" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="315">WORKERS</text>
  <line class="arrow" x1="180" y1="338" x2="180" y2="374"></line>
  <polygon class="ahead" points="180,382 176,374 184,374"></polygon>
  <rect class="node" x="72" y="386" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="409">DOWNSTREAM</text>
  <text class="nsub" x="180" y="428">200+ DESTINATIONS</text>
  <line class="bx" x1="24" y1="454" x2="36" y2="466"></line>
  <line class="bx" x1="36" y1="454" x2="24" y2="466"></line>
  <text class="blabel" x="44" y="464">ITS RETRIES PILE ONTO THE PARTNER</text>
</svg>