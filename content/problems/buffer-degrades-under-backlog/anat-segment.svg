<svg class="anat" viewBox="0 0 640 212" role="img" aria-label="Segment: the backlog lives in MySQL rows, one database per owner. What slows as it fills: nothing, few jobs in use, databases replaced about every 30 minutes. When full: the partner, 100,000 a second against a normal 16,000. Still breaks: its retries pile onto the partner." xmlns="http://www.w3.org/2000/svg">
  <path class="replay" d="M 300 60 C 360 6, 520 6, 576 56"></path>
  <polygon class="rhead" points="581,58 571,53 573,61"></polygon>
  <text class="rlabel" x="440" y="16">THE PARTNER: 100,000/S AGAINST A NORMAL 16,000</text>
  <rect class="node" x="8" y="60" width="120" height="52" rx="7"></rect>
  <text class="nlabel" x="68" y="81">SENDERS</text>
  <text class="nsub" x="68" y="98">42,000 SOURCES</text>
  <line class="arrow" x1="136" y1="86" x2="170" y2="86"></line>
  <polygon class="ahead" points="178,86 170,82 170,90"></polygon>
  <line class="arrow" x1="354" y1="86" x2="388" y2="86"></line>
  <polygon class="ahead" points="396,86 388,82 388,90"></polygon>
  <line class="arrow" x1="490" y1="86" x2="524" y2="86"></line>
  <polygon class="ahead" points="532,86 524,82 524,90"></polygon>
  <rect class="node" x="180" y="60" width="166" height="52" rx="7"></rect>
  <text class="nlabel" x="263" y="81">THE QUEUE</text>
  <text class="nsub" x="263" y="98">CENTRIFUGE</text>
  <rect class="node" x="398" y="60" width="84" height="52" rx="7"></rect>
  <text class="nlabel" x="440" y="91">WORKERS</text>
  <rect class="node" x="534" y="60" width="96" height="52" rx="7"></rect>
  <text class="nlabel" x="582" y="77">DOWNSTREAM</text>
  <text class="nsub" x="582" y="91">200+</text>
  <text class="nsub" x="582" y="105">DESTINATIONS</text>
  <line class="drop" x1="263" y1="112" x2="263" y2="124"></line>
  <rect class="state" x="151" y="124" width="225" height="26" rx="6"></rect>
  <text class="slabel" x="263" y="141">MYSQL ROWS · ONE DB PER OWNER</text>
  <circle class="keydot" cx="161" cy="162" r="5"></circle>
  <text class="klabel" x="263" y="166">NOTHING: FEW JOBS IN USE,</text>
  <text class="klabel" x="263" y="181">DBS REPLACED ~30 MIN</text>
  <line class="bx" x1="50" y1="193" x2="62" y2="205"></line>
  <line class="bx" x1="62" y1="193" x2="50" y2="205"></line>
  <text class="blabel" x="72" y="203">ITS RETRIES PILE ONTO THE PARTNER</text>
</svg>