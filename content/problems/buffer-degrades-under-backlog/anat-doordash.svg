<svg class="anat" viewBox="0 0 640 152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DoorDash: the backlog lives in one rabbitmq server, then kafka. What slows as it fills: old: the queue slowed its own senders. When full: before: the app servers, as delay. Still breaks: a deploy briefly stops the workers">
  <path class="replay" d="M 250 34 C 200 8, 130 8, 92 30"/><polygon class="rhead" points="88,32 98,26 98,34"/>
  <text class="rlabel" x="320" y="14">BEFORE: THE APP SERVERS, AS DELAY</text>
  <rect class="node" x="8" y="40" width="108" height="34" rx="7"/>
  <text class="nlabel" x="62" y="55">SENDERS</text><text class="nsub" x="62" y="68">APP SERVERS · 900+ TASK TYPES</text>
  <line class="arrow" x1="126" y1="57" x2="192" y2="57"/><polygon class="ahead" points="200,57 192,53 192,61"/>
  <rect class="node" x="202" y="40" width="176" height="34" rx="7"/>
  <text class="nlabel" x="290" y="55">THE QUEUE</text><text class="nsub" x="290" y="68">SWITCHED OVER BY A FLAG</text>
  <line class="drop" x1="290" y1="74" x2="290" y2="88"/>
  <rect class="state" x="202" y="88" width="176" height="26" rx="6"/>
  <text class="slabel" x="290" y="105">ONE RABBITMQ SERVER, THEN KAFKA</text>
  <circle class="keydot" cx="378" cy="40" r="6"/>
  <text class="klabel" x="290" y="128">OLD: THE QUEUE SLOWED ITS OWN SENDERS</text>
  <line class="arrow" x1="388" y1="57" x2="418" y2="57"/><polygon class="ahead" points="426,57 418,53 418,61"/>
  <rect class="node" x="428" y="40" width="70" height="34" rx="7"/><text class="nlabel" x="463" y="61">WORKERS</text>
  <line class="arrow" x1="498" y1="57" x2="518" y2="57"/><polygon class="ahead" points="526,57 518,53 518,61"/>
  <rect class="node" x="528" y="40" width="104" height="34" rx="7"/>
  <text class="nlabel" x="580" y="55">DOWNSTREAM</text><text class="nsub" x="580" y="68">CELERY WORKERS</text>
  <line class="bx" x1="440" y1="120" x2="452" y2="132"/><line class="bx" x1="452" y1="120" x2="440" y2="132"/>
  <text class="blabel" x="460" y="130">A DEPLOY BRIEFLY STOPS THE WORKERS</text>
 </svg>
