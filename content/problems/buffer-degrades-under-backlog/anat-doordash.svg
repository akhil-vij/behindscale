<svg class="anat" viewBox="0 0 640 212" role="img" aria-label="DoorDash: the backlog lives in one RabbitMQ server, then Kafka. What slows as it fills: the old queue slowed its own senders. When full: before, the app servers, as delay. Still breaks: a deploy briefly stops the workers." xmlns="http://www.w3.org/2000/svg">
  <path class="replay" d="M 236 60 C 200 24, 104 24, 74 56"></path>
  <polygon class="rhead" points="68,58 78,52 78,60"></polygon>
  <text class="rlabel" x="155" y="16">BEFORE: THE APP SERVERS, AS DELAY</text>
  <rect class="node" x="8" y="60" width="120" height="52" rx="7"></rect>
  <text class="nlabel" x="68" y="77">SENDERS</text>
  <text class="nsub" x="68" y="91">APP SERVERS</text>
  <text class="nsub" x="68" y="105">900+ TASK TYPES</text>
  <line class="arrow" x1="136" y1="86" x2="170" y2="86"></line>
  <polygon class="ahead" points="178,86 170,82 170,90"></polygon>
  <line class="arrow" x1="354" y1="86" x2="388" y2="86"></line>
  <polygon class="ahead" points="396,86 388,82 388,90"></polygon>
  <line class="arrow" x1="490" y1="86" x2="524" y2="86"></line>
  <polygon class="ahead" points="532,86 524,82 524,90"></polygon>
  <rect class="node" x="180" y="60" width="166" height="52" rx="7"></rect>
  <text class="nlabel" x="263" y="77">THE QUEUE</text>
  <text class="nsub" x="263" y="91">SWITCHED OVER</text>
  <text class="nsub" x="263" y="105">BY A FLAG</text>
  <rect class="node" x="398" y="60" width="84" height="52" rx="7"></rect>
  <text class="nlabel" x="440" y="91">WORKERS</text>
  <rect class="node" x="534" y="60" width="96" height="52" rx="7"></rect>
  <text class="nlabel" x="582" y="77">DOWNSTREAM</text>
  <text class="nsub" x="582" y="91">CELERY</text>
  <text class="nsub" x="582" y="105">WORKERS</text>
  <line class="drop" x1="263" y1="112" x2="263" y2="124"></line>
  <rect class="state" x="141" y="124" width="245" height="26" rx="6"></rect>
  <text class="slabel" x="263" y="141">ONE RABBITMQ SERVER, THEN KAFKA</text>
  <circle class="keydot" cx="175" cy="162" r="5"></circle>
  <text class="klabel" x="263" y="166">OLD: THE QUEUE SLOWED</text>
  <text class="klabel" x="263" y="181">ITS OWN SENDERS</text>
  <line class="bx" x1="50" y1="193" x2="62" y2="205"></line>
  <line class="bx" x1="62" y1="193" x2="50" y2="205"></line>
  <text class="blabel" x="72" y="203">A DEPLOY BRIEFLY STOPS THE WORKERS</text>
</svg>