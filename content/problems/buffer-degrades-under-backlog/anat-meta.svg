<svg class="anat" viewBox="0 0 640 152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meta: the backlog lives in mysql rows · many databases. What slows as it fills: old row versions · kept short by checkpoints. When full: nobody: delay, not loss. Still breaks: a failover strands capacity">
