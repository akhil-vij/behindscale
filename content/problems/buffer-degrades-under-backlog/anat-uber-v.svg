<svg class="anat anat-v" viewBox="0 0 360 496" role="img" aria-label="Uber: the backlog lives in Kafka's log, unchanged. What slows as it fills: nothing, but one job per call, per line. When full: the proxy is told how fast to send. Still breaks: a reshuffle sends jobs twice, and dead letters wait." xmlns="http://www.w3.org/2000/svg">
  <path class="replay" d="M 72 152 C 36 166, 36 296, 66 310"></path>
  <polygon class="rhead" points="72,310 63,305 63,315"></polygon>
  <rect class="node" x="72" y="10" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="33">SENDERS</text>
  <text class="nsub" x="180" y="52">300+ SERVICES</text>
  <line class="arrow" x1="180" y1="66" x2="180" y2="74"></line>
  <text class="rlabel" x="180" y="97">THE PROXY IS TOLD HOW FAST TO SEND</text>
  <line class="arrow" x1="180" y1="112" x2="180" y2="118"></line>
  <polygon class="ahead" points="180,124 176,118 184,118"></polygon>
  <rect class="node" x="72" y="124" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="147">THE QUEUE</text>
  <text class="nsub" x="180" y="166">CONSUMER PROXY ON TOP</text>
  <line class="drop" x1="180" y1="180" x2="180" y2="192"></line>
  <rect class="state" x="83" y="192" width="195" height="30" rx="6"></rect>
  <text class="slabel" x="180" y="211">KAFKA'S LOG · UNCHANGED</text>
  <circle class="keydot" cx="90" cy="240" r="5"></circle>
  <text class="klabel" x="180" y="244">NOTHING, BUT ONE JOB</text>
  <text class="klabel" x="180" y="260">PER CALL, PER LINE</text>
  <rect class="node" x="72" y="282" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="315">WORKERS</text>
  <line class="arrow" x1="180" y1="338" x2="180" y2="374"></line>
  <polygon class="ahead" points="180,382 176,374 184,374"></polygon>
  <rect class="node" x="72" y="386" width="216" height="56" rx="7"></rect>
  <text class="nlabel" x="180" y="419">DOWNSTREAM</text>
