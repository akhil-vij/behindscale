<svg class="anat" viewBox="0 0 640 152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your design: the backlog lives where you chose, what slows as it fills, who feels it when full, and what still breaks it">
  <text class="rlabel ns" x="320" y="14">{{dFull}}</text>
  <rect class="node" x="8" y="40" width="108" height="34" rx="7"/>
  <text class="nlabel" x="62" y="61">SENDERS</text>
  <line class="arrow" x1="126" y1="57" x2="192" y2="57"/><polygon class="ahead" points="200,57 192,53 192,61"/>
  <rect class="node" x="202" y="40" width="176" height="34" rx="7"/>
  <text class="nlabel" x="290" y="61">YOUR QUEUE</text>
  <line class="drop" x1="290" y1="74" x2="290" y2="88"/>
  <rect class="state" x="202" y="88" width="176" height="26" rx="6"/>
  <text class="slabel" x="290" y="105">{{dLives}}</text>
  <text class="klabel" x="290" y="128">{{dSlows}}</text>
  <line class="arrow" x1="388" y1="57" x2="418" y2="57"/><polygon class="ahead" points="426,57 418,53 418,61"/>
  <rect class="node" x="428" y="40" width="70" height="34" rx="7"/><text class="nlabel" x="463" y="61">WORKERS</text>
  <line class="arrow" x1="498" y1="57" x2="518" y2="57"/><polygon class="ahead" points="526,57 518,53 518,61"/>
  <rect class="node" x="528" y="40" width="104" height="34" rx="7"/><text class="nlabel" x="580" y="61">PARTNER</text>
  <line class="bx" x1="300" y1="138" x2="312" y2="150"/><line class="bx" x1="312" y1="138" x2="300" y2="150"/>
  <text class="blabel" x="320" y="148">{{dBreaks}}</text>
</svg>
