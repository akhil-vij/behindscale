<svg viewBox="0 0 700 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The webapp routes a query by first looking up a workspace in the metadata cluster then connecting to one workspace shard, an active-active pair of MySQL instances db A and db B; a separate kitchen-sink cluster holds data tied to no workspace"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="rah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">ONE APPLICATION ROUTED EVERYTHING</text>
<rect x="20" y="104" width="120" height="64" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.5"/>
<text x="80" y="132" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#2563EB" text-anchor="middle" font-weight="700">webapp</text>
<text x="80" y="150" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">the one app</text>
<rect x="230" y="32" width="210" height="50" rx="6" fill="#FDF3E7" stroke="#B45309" stroke-width="1.25"/>
<text x="335" y="52" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">metadata cluster</text>
<text x="335" y="68" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">workspace id -> shard id</text>
<line x1="140" y1="120" x2="230" y2="60" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<text x="150" y="102" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="start" font-weight="400">1. which shard?</text>
<rect x="230" y="100" width="210" height="104" rx="8" fill="#FCFCFD" stroke="#8A8A94" stroke-width="1.25"/>
<text x="240" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#8A8A94" text-anchor="start" font-weight="400">a workspace shard</text>
<rect x="244" y="124" width="88" height="60" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.25"/>
<text x="288" y="150" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">db A</text>
<rect x="346" y="124" width="88" height="60" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.25"/>
<text x="390" y="150" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">db B</text>
<line x1="332" y1="154" x2="346" y2="154" stroke="#52525B" stroke-width="1.25" marker-end="url(#fah)"/>
<line x1="346" y1="164" x2="332" y2="164" stroke="#52525B" stroke-width="1.25" marker-end="url(#fah)"/>
<text x="335" y="197" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">active-active: both take reads + writes</text>
<line x1="140" y1="150" x2="230" y2="150" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<text x="150" y="142" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="start" font-weight="400">2. connect</text>
<rect x="486" y="120" width="196" height="64" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.25"/>
<text x="584" y="144" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2E7D46" text-anchor="middle" font-weight="700">kitchen-sink cluster</text>
<text x="584" y="162" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">data tied to no workspace</text>
<path d="M 140 160 C 250 220, 380 214, 484 176" fill="none" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<text x="158" y="178" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="start" font-weight="400">3. or no-workspace data</text>
<text x="20" y="232" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="start" font-weight="400">thousands of workspaces per shard; all of a workspace's data lives on its one shard</text>
</svg>