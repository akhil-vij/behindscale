<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two isolated services share hidden dependencies below them; a failure in a shared dependency reaches both"><defs><marker id="rh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker></defs><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">ISOLATED ON PAPER, COUPLED UNDERNEATH</text><rect x="70" y="46" width="200" height="70" rx="9" fill="none" stroke="#15803D" stroke-width="1.3" stroke-dasharray="5 4"/><text x="78" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#15803D">boundary</text><rect x="90" y="66" width="160" height="40" rx="7" fill="#2563EB18" stroke="#2563EB" stroke-width="1.3"/><text x="170" y="91" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="700">SERVICE A</text><rect x="430" y="46" width="200" height="70" rx="9" fill="none" stroke="#15803D" stroke-width="1.3" stroke-dasharray="5 4"/><text x="438" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#15803D">boundary</text><rect x="450" y="66" width="160" height="40" rx="7" fill="#7C3AED18" stroke="#7C3AED" stroke-width="1.3"/><text x="530" y="91" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#7C3AED" text-anchor="middle" font-weight="700">SERVICE B</text><text x="350" y="140" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#52525B" text-anchor="middle" font-weight="700">Each service sits behind its own boundary - on top, they look fully isolated.</text><text x="16" y="170" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#8A8A94" letter-spacing="0.5">BUT BOTH DEPEND ON THE SAME THINGS UNDERNEATH</text><rect x="120" y="184" width="120" height="42" rx="7" fill="#F4F2EE" stroke="#52525B" stroke-width="1.3"/><text x="180" y="209" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#52525B" text-anchor="middle" font-weight="700">DNS</text><rect x="290" y="184" width="120" height="42" rx="7" fill="#F4F2EE" stroke="#52525B" stroke-width="1.3"/><text x="350" y="209" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#52525B" text-anchor="middle" font-weight="700">identity</text><rect x="460" y="184" width="120" height="42" rx="7" fill="#DC262612" stroke="#DC2626" stroke-width="1.3"/><text x="520" y="209" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="middle" font-weight="700">control plane</text><text x="520" y="240" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">fails</text><line x1="170" y1="106" x2="180" y2="184" stroke="#C9C9CE" stroke-width="1" stroke-dasharray="3 3"/><line x1="170" y1="106" x2="350" y2="184" stroke="#C9C9CE" stroke-width="1" stroke-dasharray="3 3"/><line x1="530" y1="106" x2="180" y2="184" stroke="#C9C9CE" stroke-width="1" stroke-dasharray="3 3"/><line x1="530" y1="106" x2="350" y2="184" stroke="#C9C9CE" stroke-width="1" stroke-dasharray="3 3"/><line x1="520" y1="184" x2="170" y2="108" stroke="#DC2626" stroke-width="2" marker-end="url(#rh)"/><line x1="520" y1="184" x2="530" y2="108" stroke="#DC2626" stroke-width="2" marker-end="url(#rh)"/><text x="350" y="272" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">A failure in a shared dependency crosses both boundaries - top-level isolation cannot stop it.</text></svg>