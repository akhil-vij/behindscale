<svg viewBox="0 0 720 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Many servers sharing one database must coordinate; one owner per store writes from memory with no coordination"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">ONE OWNER PER STORE</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#8A8A94"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#15803D"/></marker></defs><text x="180" y="44" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#B0752A" text-anchor="middle">the usual shape</text><text x="540" y="44" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">single-writer ownership</text><line x1="360" y1="52" x2="360" y2="196" stroke="#E0DCD4" stroke-width="1"/><rect x="40" y="60" width="56" height="30" rx="6" fill="#FBF3E7" stroke="#B0752A" stroke-width="1.2"/><text x="68" y="79" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">server</text><line x1="68" y1="90" x2="180" y2="128" stroke="#8A8A94" stroke-width="1.2" marker-end="url(#a)"/><rect x="106" y="60" width="56" height="30" rx="6" fill="#FBF3E7" stroke="#B0752A" stroke-width="1.2"/><text x="134" y="79" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">server</text><line x1="134" y1="90" x2="180" y2="128" stroke="#8A8A94" stroke-width="1.2" marker-end="url(#a)"/><rect x="172" y="60" width="56" height="30" rx="6" fill="#FBF3E7" stroke="#B0752A" stroke-width="1.2"/><text x="200" y="79" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">server</text><line x1="200" y1="90" x2="180" y2="128" stroke="#8A8A94" stroke-width="1.2" marker-end="url(#a)"/><rect x="120" y="130" width="120" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.3"/><text x="180" y="151" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">one shared database</text><text x="180" y="184" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#B0752A" text-anchor="middle">every write: lock + invalidate</text><rect x="430" y="60" width="98" height="40" rx="8" fill="#EAF4EC" stroke="#15803D" stroke-width="1.5"/><text x="479" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">owner</text><text x="479" y="91" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#15803D" text-anchor="middle">holds the lease</text><line x1="479" y1="100" x2="479" y2="126" stroke="#15803D" stroke-width="1.4" marker-end="url(#g)"/><rect x="439" y="128" width="80" height="30" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="479" y="147" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">its store</text><rect x="560" y="60" width="98" height="40" rx="8" fill="#EAF4EC" stroke="#15803D" stroke-width="1.5"/><text x="609" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">owner</text><text x="609" y="91" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#15803D" text-anchor="middle">holds the lease</text><line x1="609" y1="100" x2="609" y2="126" stroke="#15803D" stroke-width="1.4" marker-end="url(#g)"/><rect x="569" y="128" width="80" height="30" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="609" y="147" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">its store</text><text x="540" y="184" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#15803D" text-anchor="middle">writes from memory: nothing to coordinate</text><text x="360" y="216" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">many servers over one database must coordinate every write; one owner per store writes from its own memory with nothing to coordinate</text></svg>