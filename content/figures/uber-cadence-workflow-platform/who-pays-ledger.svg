<svg viewBox="0 0 700 282" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A comparison table of embedded versus central across engine copies, teams operating, code per team, shared blast radius, and noisy-neighbor risk, showing neither wins every row" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">THE SAME PROBLEM, TWO SOLUTIONS WITH DIFFERENT TRADE-OFFS</text>
<rect x="16" y="44" width="190" height="34" rx="6" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
