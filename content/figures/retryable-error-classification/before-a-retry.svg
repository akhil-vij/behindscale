<svg viewBox="0 0 720 188" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three gates before a retry goes out: is it retryable, is there budget, and how long to wait"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">BEFORE A RETRY GOES OUT</text><defs><marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#15803D"/></marker><marker id="s" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#B0752A"/></marker></defs><text x="16" y="89.0" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B">a request</text><text x="16" y="101.0" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B">failed</text><rect x="56" y="56" width="150" height="60" rx="10" fill="#EAF4EC" stroke="#15803D" stroke-width="1.8"/><text x="131.0" y="76" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Should we retry</text><text x="131.0" y="89" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">this error?</text><text x="131.0" y="104" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#15803D" text-anchor="middle">Retryable Error</text><text x="131.0" y="114" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#15803D" text-anchor="middle">Classification</text><rect x="285" y="56" width="150" height="60" rx="10" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="360.0" y="76" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Is there retry</text><text x="360.0" y="89" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">budget left?</text><text x="360.0" y="108" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">Retry Budget</text><rect x="514" y="56" width="150" height="60" rx="10" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="589.0" y="76" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">How long should</text><text x="589.0" y="89" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">we wait?</text><text x="589.0" y="108" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">Backoff and Jitter</text><line x1="70" y1="86.0" x2="50" y2="86.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#g)"/><line x1="208" y1="86.0" x2="279" y2="86.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#g)"/><text x="242.5" y="80.0" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#15803D" text-anchor="middle">yes</text><line x1="437" y1="86.0" x2="508" y2="86.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#g)"/><text x="471.5" y="80.0" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#15803D" text-anchor="middle">yes</text><line x1="666" y1="86.0" x2="690" y2="86.0" stroke="#15803D" stroke-width="1.8" marker-end="url(#g)"/><text x="705" y="80.0" font-family="'Inter',system-ui,sans-serif" font-size="9" font-weight="700" fill="#15803D" text-anchor="middle">retry</text><line x1="131.0" y1="118" x2="131.0" y2="138" stroke="#B0752A" stroke-width="1.4" marker-end="url(#s)"/><text x="137.0" y="136" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#B0752A">no, stop</text><line x1="360.0" y1="118" x2="360.0" y2="138" stroke="#B0752A" stroke-width="1.4" marker-end="url(#s)"/><text x="366.0" y="136" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#B0752A">no, stop</text><text x="360" y="182" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">this pattern is the first gate - whether a failure may be retried at all - before the budget and the wait</text></svg>