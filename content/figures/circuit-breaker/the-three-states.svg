<svg viewBox="0 0 700 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A state diagram: closed, open, and half-open, with arrows for tripping open, cooling down, and probing to recover"><text x="16" y="24" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">THE BREAKER'S THREE STATES</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52525B"/></marker></defs><rect x="72.0" y="57.0" width="156" height="58" rx="11" fill="#E9F3EC" stroke="#15803D" stroke-width="1.6"/><text x="150" y="83" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#1A1A1F" text-anchor="middle">CLOSED</text><text x="150" y="101" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">calls pass through</text><rect x="474.0" y="57.0" width="156" height="58" rx="11" fill="#FBEBEB" stroke="#DC2626" stroke-width="1.6"/><text x="552" y="83" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#1A1A1F" text-anchor="middle">OPEN</text><text x="552" y="101" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">calls fail instantly</text><rect x="273.0" y="185.0" width="156" height="58" rx="11" fill="#FBF3E2" stroke="#B0752A" stroke-width="1.6"/><text x="351" y="211" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#1A1A1F" text-anchor="middle">HALF-OPEN</text><text x="351" y="229" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">one test call</text><path d="M 228 78 L 474 78" fill="none" stroke="#52525B" stroke-width="1.6" marker-end="url(#ah)"/><text x="351" y="66" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">too many failures</text><path d="M 560 115 C 560 175, 470 200, 431 208" fill="none" stroke="#52525B" stroke-width="1.6" marker-end="url(#ah)"/><text x="545" y="170" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="start">after a cooldown</text><path d="M 271 208 C 232 200, 150 175, 150 117" fill="none" stroke="#52525B" stroke-width="1.6" marker-end="url(#ah)"/><text x="150" y="172" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="end">probe succeeds</text><path d="M 421 224 C 490 232, 556 190, 556 117" fill="none" stroke="#52525B" stroke-width="1.6" marker-end="url(#ah)"/><text x="470" y="250" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">probe fails</text></svg>