<svg viewBox="0 0 700 192" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stripe's four admission-control layers and how often each fires">
 <defs><marker id="s_ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A8A94"/></marker></defs>
 <text x="180" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2563EB" letter-spacing="0.5" text-anchor="middle">PER-USER RATE LIMITERS &#183; EVERY DAY</text>
 <path d="M20,30 L20,36 L340,36 L340,30" fill="none" stroke="#2563EB" stroke-width="1"/>
 <text x="524" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#B45309" letter-spacing="0.5" text-anchor="middle">WHOLE-SYSTEM LOAD SHEDDERS &#183; INCIDENTS ONLY</text>
 <path d="M360,30 L360,36 L686,36 L686,30" fill="none" stroke="#B45309" stroke-width="1"/>
 <rect x="20" y="48" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
 <text x="95" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">REQUEST</text>
