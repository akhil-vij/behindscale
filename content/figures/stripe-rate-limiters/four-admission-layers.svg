 <rect x="190" y="48" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
 <text x="265" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">CONCURRENT</text>
 <text x="265" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">REQUESTS LIMITER</text>
 <rect x="360" y="48" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
 <text x="435" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">FLEET USAGE</text>
 <text x="435" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">SHEDDER</text>
 <rect x="530" y="48" width="156" height="72" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
 <text x="608" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">WORKER UTILIZATION</text>
 <text x="608" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">SHEDDER</text>
 <line x1="172" y1="84" x2="188" y2="84" stroke="#8A8A94" stroke-width="1.5" marker-end="url(#s_ah)"/>
 <line x1="342" y1="84" x2="358" y2="84" stroke="#8A8A94" stroke-width="1.5" marker-end="url(#s_ah)"/>
 <line x1="512" y1="84" x2="528" y2="84" stroke="#8A8A94" stroke-width="1.5" marker-end="url(#s_ah)"/>
 <text x="20" y="150" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#8A8A94" letter-spacing="1">HOW OFTEN IT FIRES &#183; REJECTIONS PER MONTH</text>
 <rect x="20" y="158" width="150" height="24" rx="4" fill="#2563EB" opacity="0.85"/>
 <text x="95" y="174" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">millions</text>
