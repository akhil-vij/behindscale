<svg viewBox="0 0 700 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A loop: apply a mitigation, observe the impact, then keep it if it helped or revert and try another"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">THE EXPERIMENT LOOP</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52525B"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#15803D"/></marker><marker id="aa" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#B0752A"/></marker></defs><rect x="45.0" y="68.0" width="150" height="56" rx="10" fill="#E9F3EC" stroke="#15803D" stroke-width="1.5"/><text x="120" y="93" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#1A1A1F" text-anchor="middle">APPLY</text><text x="120" y="110" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">a mitigation, on suspicion</text><rect x="285.0" y="68.0" width="150" height="56" rx="10" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.5"/><text x="360" y="93" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#1A1A1F" text-anchor="middle">OBSERVE</text><text x="360" y="110" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">did the impact drop?</text><rect x="511.0" y="46.0" width="150" height="52" rx="10" fill="#E9F3EC" stroke="#15803D" stroke-width="1.5"/><text x="586" y="69" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#1A1A1F" text-anchor="middle">KEEP</text><text x="586" y="86" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">recovered</text><line x1="195" y1="96" x2="285" y2="96" stroke="#52525B" stroke-width="1.6" marker-end="url(#a)"/><text x="240" y="88" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">watch</text><path d="M 428 84 C 470 72, 490 72, 511 72" fill="none" stroke="#15803D" stroke-width="1.6" marker-end="url(#ag)"/><text x="470" y="64" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#15803D" text-anchor="middle">impact dropped</text><path d="M 360 124 C 360 184, 120 184, 120 124" fill="none" stroke="#B0752A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aa)"/><text x="240" y="180" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#B0752A" text-anchor="middle">no change - revert, try another (it is safe and cheap)</text></svg>