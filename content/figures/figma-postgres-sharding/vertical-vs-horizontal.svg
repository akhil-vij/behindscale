<svg viewBox="0 0 700 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, vertical partitioning moves whole tables onto separate servers and cannot split one oversized table; right, horizontal sharding splits one table's rows across servers, which is what relieves an oversized table"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="aah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B45309"/></marker><marker id="vah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">TWO DIFFERENT WAYS TO CUT A DATABASE</text>
<rect x="12" y="34" width="326" height="196" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="28" y="54" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="start" font-weight="700">VERTICAL: move whole tables</text>
<rect x="40" y="70" width="120" height="72" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="100" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2563EB" text-anchor="middle" font-weight="700">one database</text>
<rect x="52" y="96" width="44" height="18" rx="3" fill="#FCFCFD" stroke="#2563EB" stroke-width="1"/><text x="74" y="109" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">tbl A</text>
<rect x="106" y="96" width="44" height="18" rx="3" fill="#FCFCFD" stroke="#2563EB" stroke-width="1"/><text x="128" y="109" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">tbl B</text>
<rect x="52" y="118" width="44" height="18" rx="3" fill="#FCFCFD" stroke="#2563EB" stroke-width="1"/><text x="74" y="131" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">tbl C</text>
<rect x="106" y="118" width="44" height="18" rx="3" fill="#FCFCFD" stroke="#2563EB" stroke-width="1"/><text x="128" y="131" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">tbl D</text>
<line x1="164" y1="106" x2="196" y2="106" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<rect x="206" y="70" width="120" height="40" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.2"/>
<text x="266" y="84" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">server 1</text>
<rect x="214" y="90" width="44" height="18" rx="3" fill="#FCFCFD" stroke="#2563EB" stroke-width="1"/><text x="236" y="103" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">tbl A</text>
<rect x="268" y="90" width="44" height="18" rx="3" fill="#FCFCFD" stroke="#2563EB" stroke-width="1"/><text x="290" y="103" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">tbl B</text>
<rect x="206" y="124" width="120" height="40" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.2"/>
<text x="266" y="138" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">server 2</text>
<rect x="214" y="144" width="44" height="18" rx="3" fill="#FCFCFD" stroke="#2563EB" stroke-width="1"/><text x="236" y="157" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">tbl C</text>
<rect x="268" y="144" width="44" height="18" rx="3" fill="#FCFCFD" stroke="#2563EB" stroke-width="1"/><text x="290" y="157" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">tbl D</text>
<text x="175" y="196" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle" font-weight="400">can't split ONE table that got too big</text>
<rect x="362" y="34" width="326" height="196" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="378" y="54" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2E7D46" text-anchor="start" font-weight="700">HORIZONTAL: split one table's rows</text>
<rect x="392" y="70" width="120" height="72" rx="7" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="452" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">one big table</text>
<text x="452" y="102" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">row 1..100</text>
<text x="452" y="113" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">row 101..200</text>
<text x="452" y="124" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">row 201..300</text>
<text x="452" y="135" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">row 301..400</text>
<line x1="516" y1="106" x2="548" y2="106" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<rect x="558" y="70" width="120" height="26" rx="5" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.2"/>
<text x="618" y="87" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#2E7D46" text-anchor="middle" font-weight="700">server 1: rows 1..</text>
<rect x="558" y="103" width="120" height="26" rx="5" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.2"/>
<text x="618" y="120" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#2E7D46" text-anchor="middle" font-weight="700">server 2: rows 101..</text>
<rect x="558" y="136" width="120" height="26" rx="5" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.2"/>
<text x="618" y="153" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#2E7D46" text-anchor="middle" font-weight="700">server 3: rows 201..</text>
<text x="525" y="196" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">exactly what relieves one oversized table</text>
</svg>