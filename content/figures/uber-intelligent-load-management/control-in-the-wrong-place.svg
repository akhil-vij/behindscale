<svg viewBox="0 0 700 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phase 1 put overload control in the stateless layer, above the storage nodes">
 <defs>
  <marker id="u_dn" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto"><path d="M0,0 L6,0 L3,6 Z" fill="#8A8A94"/></marker>
  <marker id="u_up" markerWidth="9" markerHeight="9" refX="3" refY="0" orient="auto"><path d="M0,6 L6,6 L3,0 Z" fill="#E5484D"/></marker>
 </defs>
 <!-- top: control layer (wrong place) -->
 <rect x="40" y="22" width="620" height="74" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
 <text x="56" y="42" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" letter-spacing="0.5">STATELESS QUERY LAYER &#183; WHERE PHASE 1 PUT CONTROL</text>
 <rect x="56" y="54" width="210" height="30" rx="6" fill="#FDF3E7" stroke="#E7C9A3"/>
 <text x="161" y="73" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">QUOTA RATE LIMITING</text>
 <rect x="280" y="54" width="364" height="30" rx="6" fill="#FDF3E7" stroke="#E7C9A3"/>
 <text x="462" y="73" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">CENTRAL REDIS &#183; PER-TENANT BUDGET</text>
 <!-- requests flow down -->
 <line x1="120" y1="100" x2="120" y2="168" stroke="#8A8A94" stroke-width="1.5" marker-end="url(#u_dn)"/>
 <text x="130" y="138" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#8A8A94">requests</text>
 <!-- storage health signal never reaches control -->
 <line x1="560" y1="168" x2="560" y2="102" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#u_up)"/>
 <line x1="553" y1="128" x2="567" y2="142" stroke="#E5484D" stroke-width="2"/>
 <line x1="567" y1="128" x2="553" y2="142" stroke="#E5484D" stroke-width="2"/>
 <text x="544" y="130" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#E5484D" text-anchor="end">storage health</text>
 <text x="544" y="144" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#52525B" text-anchor="end">never reaches the decision</text>
 <!-- bottom: storage nodes (where overload shows up) -->
 <rect x="40" y="170" width="620" height="72" rx="10" fill="#F4F2EE" stroke="#D6D2CA"/>
 <text x="56" y="190" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#52525B" letter-spacing="0.5">STORAGE NODES &#183; THOUSANDS OF PARTITIONS &#183; WHERE OVERLOAD SHOWS UP</text>
 <g>
  <rect x="56" y="200" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#D6D2CA"/>
  <rect x="108" y="200" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#D6D2CA"/>
  <rect x="160" y="200" width="44" height="26" rx="4" fill="#FDECEC" stroke="#E5484D"/>
  <rect x="212" y="200" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#D6D2CA"/>
  <rect x="264" y="200" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#D6D2CA"/>
  <rect x="316" y="200" width="44" height="26" rx="4" fill="#FDECEC" stroke="#E5484D"/>
  <rect x="368" y="200" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#D6D2CA"/>
  <rect x="420" y="200" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#D6D2CA"/>
  <rect x="472" y="200" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#D6D2CA"/>
  <rect x="524" y="200" width="44" height="26" rx="4" fill="#FDECEC" stroke="#E5484D"/>
  <rect x="576" y="200" width="44" height="26" rx="4" fill="#FFFFFF" stroke="#D6D2CA"/>
 </g>
</svg>
