<svg viewBox="0 0 720 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, a monitor inside the platform dies with it, no alert; right, an outside watcher survives and alerts"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">INSIDE DIES, OUTSIDE SURVIVES</text><text x="180" y="44" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">monitor on the platform</text><text x="540" y="44" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">independent watcher</text><line x1="360" y1="54" x2="360" y2="212" stroke="#E0DCD4" stroke-width="1"/><rect x="44" y="68" width="240" height="104" rx="10" fill="#FBECEC" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="164" y="84" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle">one failure domain</text><rect x="64" y="96" width="90" height="52" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text x="109.0" y="121.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">system</text><text x="109.0" y="134.0" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#DC2626" text-anchor="middle">DOWN</text><rect x="174" y="96" width="90" height="52" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text x="219.0" y="121.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">monitor</text><text x="219.0" y="134.0" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#DC2626" text-anchor="middle">also DOWN</text><text x="164" y="196" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#DC2626" text-anchor="middle">the outage kills both - no alert fires</text><rect x="404" y="72" width="118" height="96" rx="10" fill="#FBECEC" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="420" y="100" width="86" height="44" rx="7" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text x="463.0" y="121.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">system</text><text x="463.0" y="134.0" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#DC2626" text-anchor="middle">DOWN</text><rect x="596" y="100" width="96" height="44" rx="7" fill="#EAF4EC" stroke="#15803D" stroke-width="1.4"/><text x="644.0" y="121.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">watcher</text><text x="644.0" y="134.0" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#15803D" text-anchor="middle">alive</text><line x1="596" y1="122" x2="524" y2="122" stroke="#15803D" stroke-width="1.6" stroke-dasharray="3 3"/><text x="560" y="116" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#15803D" text-anchor="middle">probe fails</text><text x="540" y="196" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#15803D" text-anchor="middle">the watcher survives - it raises the alarm</text><text x="360" y="228" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">a monitor that shares the platform goes dark with it; a watcher in a separate failure domain still sees the outage</text></svg>