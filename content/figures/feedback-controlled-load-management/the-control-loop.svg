<svg viewBox="0 0 700 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A four-step loop: measure a signal, compare to target, adjust admission, and measure again"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">THE LOOP, NOT A NUMBER</text><defs><marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2563EB"/></marker></defs><rect x="60" y="46" width="176" height="54" rx="10" fill="#ECF1FC" stroke="#2563EB" stroke-width="1.4"/><text x="148.0" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Requests hit the service</text><text x="148.0" y="86" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">some load arrives</text><rect x="464" y="46" width="176" height="54" rx="10" fill="#ECF1FC" stroke="#2563EB" stroke-width="1.4"/><text x="552.0" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Measure a live signal</text><text x="552.0" y="86" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">wait time, latency, errors</text><rect x="464" y="150" width="176" height="54" rx="10" fill="#ECF1FC" stroke="#2563EB" stroke-width="1.4"/><text x="552.0" y="174" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Compare to the target</text><text x="552.0" y="190" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">too slow, or headroom?</text><rect x="60" y="150" width="176" height="54" rx="10" fill="#ECF1FC" stroke="#2563EB" stroke-width="1.4"/><text x="148.0" y="174" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Adjust how much to admit</text><text x="148.0" y="190" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">nudge the limit up or down</text><line x1="240" y1="73.0" x2="458" y2="73.0" stroke="#2563EB" stroke-width="1.6" marker-end="url(#b)"/><line x1="552.0" y1="104" x2="552.0" y2="144" stroke="#2563EB" stroke-width="1.6" marker-end="url(#b)"/><line x1="460" y1="177.0" x2="242" y2="177.0" stroke="#2563EB" stroke-width="1.6" marker-end="url(#b)"/><line x1="148.0" y1="146" x2="148.0" y2="106" stroke="#2563EB" stroke-width="1.6" marker-end="url(#b)"/><text x="350" y="110" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">measure, correct, repeat</text><text x="350" y="126" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">no fixed number to outgrow</text><text x="350" y="224" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">a closed loop watches the real system and slides the limit to follow capacity - instead of trusting one fixed number</text></svg>