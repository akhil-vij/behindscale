<svg viewBox="0 0 700 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The others dedupe at the boundary; Segment dedupes at a downstream ledger">
 <defs><marker id="s_ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A8A94"/></marker></defs>
 <!-- ROW 1: cooperative, at the boundary -->
 <text x="16" y="26" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">COOPERATIVE &#183; DEDUP AT THE BOUNDARY</text>
 <rect x="24" y="36" width="196" height="46" rx="8" fill="#FFFFFF" stroke="#D6D2CA"/>
 <text x="122" y="56" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#1A1A1F" text-anchor="middle">CLIENT</text>
 <text x="122" y="72" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#52525B" text-anchor="middle">sends a key</text>
 <line x1="220" y1="59" x2="264" y2="59" stroke="#8A8A94" stroke-width="1.5" marker-end="url(#s_ah)"/>
 <rect x="268" y="36" width="330" height="46" rx="8" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.5"/>
 <text x="433" y="56" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">SERVICE</text>
 <text x="433" y="72" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#52525B" text-anchor="middle">checks the key, dedupes here</text>
 <!-- ROW 2: Segment, downstream -->
 <text x="16" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">SEGMENT &#183; DEDUP DOWNSTREAM</text>
 <rect x="24" y="128" width="150" height="46" rx="8" fill="#FFFFFF" stroke="#D6D2CA"/>
 <text x="99" y="148" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#1A1A1F" text-anchor="middle">SDK</text>
 <text x="99" y="164" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#52525B" text-anchor="middle">just a random ID</text>
 <line x1="174" y1="151" x2="206" y2="151" stroke="#8A8A94" stroke-width="1.5" marker-end="url(#s_ah)"/>
 <rect x="210" y="128" width="176" height="46" rx="8" fill="#FDF3E7" stroke="#B45309"/>
 <text x="298" y="155" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="#B45309" text-anchor="middle">duplicates flow through</text>
 <line x1="386" y1="151" x2="418" y2="151" stroke="#8A8A94" stroke-width="1.5" marker-end="url(#s_ah)"/>
 <rect x="422" y="128" width="252" height="46" rx="8" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.5"/>
 <text x="548" y="148" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#2E7D46" text-anchor="middle">LEDGER</text>
 <text x="548" y="164" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#52525B" text-anchor="middle">remembers recent IDs, drops repeats</text>
</svg>
