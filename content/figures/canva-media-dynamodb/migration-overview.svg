<svg viewBox="0 0 700 234" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Migration flow left to right: replicate hot media first, dual-read compare to catch bugs, read from DynamoDB with MySQL fallback, then switch writes over; result is zero downtime with improved latency, and a rollback flag can revert to MySQL in seconds at any step"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400">THE WHOLE MIGRATION, IN ORDER</text>
<rect x="20" y="52" width="150" height="50" rx="8" fill="#FCFCFD" stroke="#2563EB" stroke-width="1.4"/>
<text x="95.0" y="74" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="700">1. Replicate</text>
<text x="95.0" y="90" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">hot media first</text>
<line x1="170" y1="77" x2="184" y2="77" stroke="#52525B" stroke-width="1.6" marker-end="url(#fah)"/>
<rect x="184" y="52" width="150" height="50" rx="8" fill="#FCFCFD" stroke="#B45309" stroke-width="1.4"/>
<text x="259.0" y="74" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">2. Compare</text>
<text x="259.0" y="90" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">dual-read, catch bugs</text>
<line x1="334" y1="77" x2="348" y2="77" stroke="#52525B" stroke-width="1.6" marker-end="url(#fah)"/>
<rect x="348" y="52" width="150" height="50" rx="8" fill="#FCFCFD" stroke="#2E7D46" stroke-width="1.4"/>
<text x="423.0" y="74" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="middle" font-weight="700">3. Read from</text>
<text x="423.0" y="90" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">DynamoDB (+ MySQL fallback)</text>
<line x1="498" y1="77" x2="512" y2="77" stroke="#52525B" stroke-width="1.6" marker-end="url(#fah)"/>
<rect x="512" y="52" width="150" height="50" rx="8" fill="#FCFCFD" stroke="#2E7D46" stroke-width="1.4"/>
<text x="587.0" y="74" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="middle" font-weight="700">4. Switch writes</text>
<text x="587.0" y="90" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">rehearsed checklist</text>
<rect x="300" y="132" width="220" height="34" rx="8" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="410" y="153" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">zero downtime, latency improved</text>
<line x1="410" y1="102" x2="410" y2="132" stroke="#2E7D46" stroke-width="1.5" marker-end="url(#gah)"/>
<rect x="20" y="186" width="644" height="34" rx="8" fill="#FDF3E7" stroke="#B45309" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="342" y="207" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#B45309" text-anchor="middle" font-weight="700">a rollback flag could revert everything to MySQL in seconds, at any step, which made each step safe to take</text>
</svg>