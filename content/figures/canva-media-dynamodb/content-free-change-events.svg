<svg viewBox="0 0 700 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A content-free message saying media 42 changed goes to a worker, which re-reads media 42's current state from the MySQL primary and writes it to DynamoDB; because truth is re-read fresh, reorder and retry are free"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="aah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B45309"/></marker><marker id="bah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">THE MESSAGE SAYS ONLY 'IT CHANGED'</text>
<rect x="24" y="80" width="150" height="44" rx="7" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
<text x="99" y="100" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">message</text>
<text x="99" y="115" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">"media 42 changed"</text>
<text x="99" y="138" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#B45309" text-anchor="middle" font-weight="700">no content inside</text>
<line x1="174" y1="102" x2="214" y2="102" stroke="#52525B" stroke-width="1.5" marker-end="url(#fah)"/>
<rect x="220" y="80" width="140" height="44" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="290" y="100" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="700">worker</text>
<text x="290" y="115" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">handles the message</text>
<rect x="430" y="36" width="230" height="40" rx="7" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="545" y="55" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2E7D46" text-anchor="middle" font-weight="700">MySQL primary</text>
<text x="545" y="69" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">the source of truth</text>
<line x1="360" y1="92" x2="430" y2="66" stroke="#2E7D46" stroke-width="1.5" marker-end="url(#gah)"/>
<text x="398" y="72" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">re-read current state</text>
<rect x="430" y="128" width="230" height="40" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="545" y="147" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">DynamoDB</text>
<text x="545" y="161" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">write it (if needed)</text>
<line x1="360" y1="112" x2="430" y2="140" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bah)"/>
<text x="398" y="134" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#2563EB" text-anchor="middle" font-weight="700">write</text>
<text x="350" y="196" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="400">Because the truth is re-read fresh every time, messages can be reordered, retried, or paused with no risk.</text>
</svg>