<svg viewBox="0 0 700 246" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live creates and updates go on a high-priority queue and live reads on a low one; workers drain high before low; a newest-first scan feeds the low queue under backpressure, so hot data replicates to DynamoDB first"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="aah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B45309"/></marker><marker id="bah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">MOVE THE HOT DATA FIRST</text>
<rect x="24" y="44" width="150" height="34" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.2"/>
<text x="99" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">live creates</text>
<text x="99" y="73" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">+ updates</text>
<rect x="24" y="116" width="150" height="30" rx="6" fill="#FDF3E7" stroke="#B45309" stroke-width="1.2"/>
<text x="99" y="135" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#B45309" text-anchor="middle" font-weight="700">live reads</text>
<rect x="24" y="168" width="150" height="44" rx="6" fill="#FCFCFD" stroke="#8A8A94" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="99" y="187" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#52525B" text-anchor="middle" font-weight="700">scan: newest</text>
<text x="99" y="201" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#52525B" text-anchor="middle" font-weight="400">media first</text>
<rect x="210" y="44" width="150" height="34" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="285" y="65" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">HIGH queue</text>
<rect x="210" y="116" width="150" height="34" rx="6" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/>
<text x="285" y="137" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#B45309" text-anchor="middle" font-weight="700">LOW queue</text>
<line x1="174" y1="61" x2="210" y2="61" stroke="#2E7D46" stroke-width="1.5" marker-end="url(#gah)"/>
<line x1="174" y1="131" x2="210" y2="131" stroke="#B45309" stroke-width="1.5" marker-end="url(#aah)"/>
<line x1="174" y1="185" x2="210" y2="140" stroke="#52525B" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="200" y1="150" x2="210" y2="138" stroke="#52525B" stroke-width="1.4" marker-end="url(#aah)"/>
<text x="150" y="232" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">scan feeds LOW only while it's nearly empty (backpressure)</text>
<rect x="410" y="80" width="120" height="50" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="470" y="100" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">workers</text>
<text x="470" y="116" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="700">HIGH before LOW</text>
<line x1="360" y1="61" x2="410" y2="95" stroke="#2E7D46" stroke-width="1.5" marker-end="url(#gah)"/>
<line x1="360" y1="131" x2="410" y2="116" stroke="#B45309" stroke-width="1.5" marker-end="url(#aah)"/>
<line x1="530" y1="105" x2="566" y2="105" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bah)"/>
<rect x="572" y="84" width="110" height="42" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="627" y="105" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">DynamoDB</text>
<text x="627" y="119" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">hot data first</text>
</svg>