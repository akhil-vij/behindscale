<rect x="336" y="62" width="30" height="30" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/><text x="351.0" y="81.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">M4</text>
