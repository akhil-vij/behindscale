<rect x="522" y="62" width="30" height="30" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/><text x="537.0" y="81.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">M7</text>
<rect x="584" y="62" width="30" height="30" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/><text x="599.0" y="81.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">M8</text>
<line x1="165" y1="108" x2="165" y2="100" stroke="#7C3AED" stroke-width="1.6"/><line x1="351" y1="108" x2="351" y2="100" stroke="#7C3AED" stroke-width="1.6"/><line x1="165" y1="108" x2="351" y2="108" stroke="#7C3AED" stroke-width="1.6"/><text x="258.0" y="124" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#7C3AED" text-anchor="middle" font-weight="700">rainbow = M1 + M4</text>
<line x1="165" y1="140" x2="165" y2="132" stroke="#B45309" stroke-width="1.6"/><line x1="599" y1="140" x2="599" y2="132" stroke="#B45309" stroke-width="1.6"/><line x1="165" y1="140" x2="599" y2="140" stroke="#B45309" stroke-width="1.6"/><text x="382.0" y="156" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#B45309" text-anchor="middle" font-weight="700">rose = M1 + M8</text>
<text x="165" y="176" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="start" font-weight="700">they share only machine 1</text>
<text x="24" y="206" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#DC2626" text-anchor="start" font-weight="700">BAD TRAFFIC from rainbow → machines 1 and 4 go down</text>
