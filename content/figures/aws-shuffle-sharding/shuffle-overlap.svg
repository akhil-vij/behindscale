<rect x="398" y="218" width="30" height="30" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/><text x="413.0" y="237.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">M5</text>
<rect x="460" y="218" width="30" height="30" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/><text x="475.0" y="237.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">M6</text>
<rect x="522" y="218" width="30" height="30" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/><text x="537.0" y="237.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">M7</text>
<rect x="584" y="218" width="30" height="30" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/><text x="599.0" y="237.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">M8</text>
<text x="350" y="262" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">rose still has machine 8, so its software resends and keeps working</text>
</svg>