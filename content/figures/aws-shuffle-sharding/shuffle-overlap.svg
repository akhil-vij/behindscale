<svg viewBox="0 0 700 276" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rainbow on machines 1 and 4, rose on machines 1 and 8, sharing only machine 1; when rainbow's traffic goes bad and takes down machines 1 and 4, rose keeps machine 8 and resends to keep working"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">WHY THE OVERLAP IS THE POINT</text>
<text x="24" y="50" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="start" font-weight="700">ASSIGN each customer a random pair of machines</text>
<rect x="150" y="62" width="30" height="30" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/><text x="165.0" y="81.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">M1</text>
