<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Small scale: pairs from 8 machines gives 28 combinations and about a 1/28th blast radius; Route 53 scale: sets of 4 from 2,048 machines gives 730 billion combinations, a unique set per domain and at most two shared machines"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">BLAST RADIUS IS A NUMBER YOU CHOOSE</text>
<rect x="12" y="38" width="330" height="120" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="28" y="58" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2563EB" text-anchor="start" font-weight="700">SMALL: PAIRS FROM 8 MACHINES</text>
<text x="28" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#1A1A1F" text-anchor="start" font-weight="700">28 possible pairs</text>
<rect x="28" y="98" width="286" height="40" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="171" y="123" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="700">one problem reaches ≈ 1/28th of customers</text>
<rect x="358" y="38" width="330" height="120" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="374" y="58" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#7C3AED" text-anchor="start" font-weight="700">ROUTE 53: SETS OF 4 FROM 2,048</text>
<text x="374" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#1A1A1F" text-anchor="start" font-weight="700">730 billion combinations</text>
<rect x="374" y="98" width="298" height="40" rx="7" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.3"/>
<text x="523" y="116" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#7C3AED" text-anchor="middle" font-weight="700">a unique set for every domain,</text>
<text x="523" y="131" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#7C3AED" text-anchor="middle" font-weight="400">no two sharing more than two machines</text>
<text x="350" y="182" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#52525B" text-anchor="middle" font-weight="700">the more machines, the smaller the blast radius</text>
</svg>