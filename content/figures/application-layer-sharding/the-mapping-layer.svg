<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The application routes through a mapping layer to a pool of independent storage units it controls"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">WHERE ROUTING LIVES</text><defs><marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2563EB"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#8A8A94"/></marker></defs><rect x="30" y="70" width="120" height="66" rx="10" fill="#ECF1FC" stroke="#2563EB" stroke-width="1.6"/><text x="90" y="100" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" font-weight="700" fill="#1A1A1F" text-anchor="middle">Application</text><text x="90" y="116" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">knows the customer</text><rect x="228" y="52" width="200" height="104" rx="12" fill="#F5F8FE" stroke="#2563EB" stroke-width="1.6"/><text x="328" y="72" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Mapping layer</text><text x="328" y="86" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">customer &#8594; which unit</text><rect x="244" y="98" width="80" height="44" rx="7" fill="#FFFFFF" stroke="#8A8A94" stroke-width="1"/><text x="284" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">fast cache</text><text x="284" y="131" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#52525B" text-anchor="middle">reads hit here</text><rect x="332" y="98" width="82" height="44" rx="7" fill="#FFFFFF" stroke="#8A8A94" stroke-width="1"/><text x="373" y="115" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">source</text><text x="373" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">of truth</text><line x1="324" y1="120" x2="330" y2="120" stroke="#8A8A94" stroke-width="1" marker-end="url(#g)"/><text x="588" y="46" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">pool of units the app arranges</text><rect x="516" y="56" width="150" height="30" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="591" y="75" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">unit A</text><rect x="516" y="94" width="150" height="30" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="591" y="113" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">unit B</text><rect x="516" y="132" width="150" height="30" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="591" y="151" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">unit C</text><line x1="152" y1="103" x2="222" y2="103" stroke="#2563EB" stroke-width="1.8" marker-end="url(#b)"/><text x="187" y="96" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#2563EB" text-anchor="middle">ask</text><line x1="430" y1="94" x2="512" y2="72" stroke="#2563EB" stroke-width="1.8" marker-end="url(#b)"/><line x1="430" y1="112" x2="512" y2="132" stroke="#2563EB" stroke-width="1.8" marker-end="url(#b)"/><text x="470" y="128" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#2563EB" text-anchor="middle">then talk direct</text><text x="360" y="204" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">the app asks the mapping which unit a customer belongs to, then talks to that unit directly - the storage never decides the sharding</text></svg>