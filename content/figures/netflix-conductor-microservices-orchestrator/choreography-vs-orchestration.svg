<text x="177" y="122" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">each service just reacts to an event</text>
<rect x="40" y="136" width="274" height="34" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="177" y="151" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">the process lives NOWHERE</text>
<text x="177" y="164" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">(only echoes in 5 services + queues)</text>
