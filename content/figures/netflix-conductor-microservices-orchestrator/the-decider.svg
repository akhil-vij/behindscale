<svg viewBox="0 0 700 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Decider takes two inputs, the blueprint (what the whole process should be) and the instance state (what has finished), compares them on every event, and schedules the next tasks or marks the workflow done"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="vah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">HOW THE DECIDER COMPUTES THE NEXT STEP</text>
<rect x="24" y="54" width="210" height="52" rx="8" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="129" y="74" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">BLUEPRINT</text>
<text x="129" y="90" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#1A1A1F" text-anchor="middle" font-weight="400">what the whole</text>
<text x="129" y="101" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#1A1A1F" text-anchor="middle" font-weight="400">process should be</text>
<rect x="24" y="122" width="210" height="52" rx="8" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/>
<text x="129" y="142" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#B45309" text-anchor="middle" font-weight="700">INSTANCE STATE</text>
<text x="129" y="158" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#1A1A1F" text-anchor="middle" font-weight="400">what has</text>
<text x="129" y="169" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#1A1A1F" text-anchor="middle" font-weight="400">finished so far</text>
<line x1="234" y1="80" x2="296" y2="105" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<line x1="234" y1="148" x2="296" y2="123" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<rect x="298" y="90" width="150" height="48" rx="9" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.6"/>
<text x="373" y="110" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#7C3AED" text-anchor="middle" font-weight="700">DECIDER</text>
<text x="373" y="126" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">compare the two</text>
<line x1="448" y1="114" x2="510" y2="114" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#vah)"/>
<rect x="512" y="88" width="176" height="52" rx="8" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="600" y="108" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">schedule next tasks</text>
<text x="600" y="124" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">(or mark done)</text>
<text x="350" y="198" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">on every event (a task finishing or failing), the next step is computed, never guessed</text>
</svg>