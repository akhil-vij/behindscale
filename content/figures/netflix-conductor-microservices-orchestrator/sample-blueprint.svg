<line x1="246" y1="95" x2="272" y2="95" stroke="#52525B" stroke-width="1.3" marker-end="url(#fah)"/>
<circle cx="294" cy="95" r="19" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.5"/><text x="294" y="99" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#7C3AED" text-anchor="middle" font-weight="700">FORK</text>
