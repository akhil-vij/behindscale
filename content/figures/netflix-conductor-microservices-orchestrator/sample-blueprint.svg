<rect x="354" y="88" width="96" height="34" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/><text x="402" y="109" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">THUMBNAILS</text>
<line x1="450" y1="53" x2="486" y2="87" stroke="#7C3AED" stroke-width="1.3"/>
