<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A title-setup workflow drawn as a graph: Inspect then Encode as worker tasks, a Fork into Subtitles and Thumbnails in parallel, a Join, then Publish, with a data-wiring arrow from Encode's output to Publish's input, and a legend distinguishing worker tasks from control tasks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="vah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">A WORKFLOW AS A BLUEPRINT</text>
<rect x="24" y="78" width="96" height="34" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/><text x="72" y="99" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">INSPECT</text>
