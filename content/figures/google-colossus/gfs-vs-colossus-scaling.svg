<svg viewBox="0 0 700 228" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="On the left, GFS keeps all metadata on one bounded master machine that fills up with nowhere to grow; on the right, Colossus stores metadata in Bigtable spread across many machines, growing by adding more machines"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="bah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">WHY BIGTABLE SCALES WHERE GFS DIDN'T</text>
<rect x="14" y="36" width="320" height="180" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="30" y="56" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#52525B" text-anchor="start" font-weight="700">GFS - ALL METADATA ON ONE MACHINE</text>
<rect x="90" y="86" width="170" height="80" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.6"/>
<text x="175" y="120" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">metadata master</text>
<text x="175" y="138" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">one machine</text>
<line x1="70" y1="80" x2="280" y2="80" stroke="#DC2626" stroke-width="2.2"/>
<text x="175" y="74" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">full - nowhere to grow</text>
<text x="175" y="190" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle" font-weight="400">Search outgrew it, and that was the wall</text>
<line x1="340" y1="126" x2="368" y2="126" stroke="#1A1A1F" stroke-width="2" marker-end="url(#fah)"/>
<text x="354" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">fix</text>
<rect x="374" y="36" width="314" height="180" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="390" y="56" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#52525B" text-anchor="start" font-weight="700">COLOSSUS - METADATA IN BIGTABLE</text>
<rect x="392" y="90" width="50" height="58" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="417" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">m1</text>
<text x="417" y="132" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">meta</text>
<rect x="452" y="90" width="50" height="58" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="477" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">m2</text>
<text x="477" y="132" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">meta</text>
<rect x="512" y="90" width="50" height="58" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="537" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">m3</text>
<text x="537" y="132" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">meta</text>
<rect x="572" y="90" width="50" height="58" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="597" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">m4</text>
<text x="597" y="132" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">meta</text>
<rect x="632" y="90" width="44" height="58" rx="6" fill="#FCFCFD" stroke="#2E7D46" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="654" y="120" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="16" fill="#2E7D46" text-anchor="middle" font-weight="700">+</text>
<text x="530" y="172" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle" font-weight="400">metadata spread across many machines</text>
<text x="530" y="190" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">grows by adding more machines</text>
</svg>