<svg viewBox="0 0 700 226" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A comparison: a cheap reversible fix fires on thin evidence, an expensive irreversible fix waits for strong evidence"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">COST SETS THE DELAY</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52525B"/></marker></defs><line x1="210" y1="176" x2="660" y2="176" stroke="#52525B" stroke-width="1.4" marker-end="url(#a)"/><text x="210" y="196" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B">time waited before the fix fires</text><text x="20" y="66" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#15803D">CHEAP, REVERSIBLE</text><text x="20" y="81" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B">e.g. restart a process</text><rect x="210" y="61" width="90" height="18" rx="4" fill="#15803D22" stroke="#15803D" stroke-width="1.2"/><circle cx="300" cy="70" r="7" fill="#C2560F"/><text x="300" y="56" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#C2560F" text-anchor="middle" font-weight="700">fire</text><text x="330" y="74" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B">fires on thin evidence - an eager trigger is fine</text><text x="20" y="124" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#DC2626">EXPENSIVE, IRREVERSIBLE</text><text x="20" y="139" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B">e.g. rebuild a replica, fail over</text><rect x="210" y="119" width="400" height="18" rx="4" fill="#DC262622" stroke="#DC2626" stroke-width="1.2"/><circle cx="610" cy="128" r="7" fill="#C2560F"/><text x="610" y="114" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#C2560F" text-anchor="middle" font-weight="700">fire</text><text x="360" y="112" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">waits for strong evidence first</text><text x="350" y="218" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">the costlier and less reversible the cure, the more evidence - and time - before it fires</text></svg>