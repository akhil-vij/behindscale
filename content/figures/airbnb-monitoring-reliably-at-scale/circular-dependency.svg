<svg viewBox="0 0 700 254" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dependency chain: the alert needs the monitoring pipeline, which runs on and sends data through the service mesh and the shared Kubernetes clusters; a loop-back arrow shows that if that foundation fails, the alert about it never fires"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="vah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">WHY THE MONITORING WENT BLIND WITH THE OUTAGE</text>
<rect x="90" y="42" width="320" height="34" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="250" y="64" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">the ALERT that says the foundation is broken</text>
<line x1="250" y1="76" x2="250" y2="104" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<text x="258" y="94" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="start" font-weight="400">is produced by</text>
<rect x="90" y="108" width="320" height="34" rx="7" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/>
<text x="250" y="130" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">the monitoring pipeline</text>
<line x1="250" y1="142" x2="250" y2="170" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<text x="258" y="160" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="start" font-weight="400">runs on, and sends its data through</text>
<rect x="90" y="174" width="320" height="44" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.6"/>
<text x="250" y="193" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="middle" font-weight="700">the service mesh, on the</text>
<text x="250" y="208" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" fill="#DC2626" text-anchor="middle" font-weight="700">SHARED KUBERNETES CLUSTERS</text>
<path d="M410,196 C560,196 560,59 412,59" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#rah)"/>
<text x="566" y="130" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">if the</text>
<text x="566" y="143" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">foundation</text>
<text x="566" y="156" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">fails, the</text>
<text x="566" y="169" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">alert never</text>
<text x="566" y="182" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">fires</text>
<text x="250" y="240" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">the monitoring depends on the very thing it is supposed to watch</text>
</svg>