<svg viewBox="0 0 720 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, a health check passes on a faulty component; right, a known-answer test catches its wrong result"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">UP, BUT STILL WRONG</text><rect x="300" y="92" width="120" height="60" rx="10" fill="#FBF3E7" stroke="#B0752A" stroke-width="1.6"/><text x="360" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#1A1A1F" text-anchor="middle">component</text><text x="360" y="132" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#DC2626" text-anchor="middle">silent defect inside</text><text x="360" y="145" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#8A8A94" text-anchor="middle">answers, but some are wrong</text><text x="150" y="52" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="700" fill="#52525B" text-anchor="middle">health check</text><rect x="40" y="64" width="220" height="40" rx="8" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.1"/><text x="150" y="80" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#1A1A1F" text-anchor="middle">"are you up?"</text><text x="150" y="95" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#15803D" text-anchor="middle">-> "yes, healthy" (passes)</text><line x1="260" y1="96" x2="298" y2="108" stroke="#8A8A94" stroke-width="1.2"/><text x="150" y="176" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="700" fill="#B0752A" text-anchor="middle">known-answer test</text><rect x="40" y="186" width="240" height="40" rx="8" fill="#FBECEC" stroke="#DC2626" stroke-width="1.4"/><text x="160" y="202" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#1A1A1F" text-anchor="middle">"12 squared?" expect 144</text><text x="160" y="217" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle">-> got 140 -> MISMATCH = FAULT</text><line x1="282" y1="200" x2="300" y2="140" stroke="#DC2626" stroke-width="1.2"/><text x="500" y="112" font-family="'Inter',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#15803D" text-anchor="start">passes - but it is wrong</text><text x="500" y="128" font-family="'Inter',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="start">caught - the answer is wrong</text><line x1="424" y1="108" x2="494" y2="108" stroke="#15803D" stroke-width="1.1" stroke-dasharray="3 3"/><line x1="424" y1="124" x2="494" y2="124" stroke="#DC2626" stroke-width="1.1" stroke-dasharray="3 3"/></svg>