<svg viewBox="0 0 700 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two lanes: a deterministic flow on top, checkpointed effects below, with replay reusing the saved results"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">FLOW VS EFFECTS</text><defs><marker id="fa" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#52525B"/></marker></defs><text x="16" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" font-weight="700">THE FLOW  ·  deterministic, replayed exactly each time</text><text x="16" y="166" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#15803D" font-weight="700">THE EFFECTS  ·  each runs once, result saved to a checkpoint</text><rect x="128" y="76" width="120" height="42" rx="9" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="188.0" y="102" font-family="'Inter',system-ui,sans-serif" font-size="12" font-weight="600" fill="#1A1A1F" text-anchor="middle">step 1</text><rect x="340" y="76" width="120" height="42" rx="9" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="400.0" y="102" font-family="'Inter',system-ui,sans-serif" font-size="12" font-weight="600" fill="#1A1A1F" text-anchor="middle">step 2</text><line x1="248" y1="97" x2="340" y2="97" stroke="#52525B" stroke-width="1.4" marker-end="url(#fa)"/><rect x="552" y="76" width="120" height="42" rx="9" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="612.0" y="102" font-family="'Inter',system-ui,sans-serif" font-size="12" font-weight="600" fill="#1A1A1F" text-anchor="middle">step 3</text><line x1="460" y1="97" x2="552" y2="97" stroke="#52525B" stroke-width="1.4" marker-end="url(#fa)"/><rect x="128" y="182" width="120" height="40" rx="9" fill="#E9F3EC" stroke="#15803D" stroke-width="1.4"/><text x="180.0" y="206" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#1A1A1F" text-anchor="middle">effect 1</text><circle cx="234" cy="202" r="10" fill="#15803D"/><path d="M 230 202 l 2.6 2.8 l 5.4 -6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="188.0" y1="118" x2="188.0" y2="182" stroke="#52525B" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="340" y="182" width="120" height="40" rx="9" fill="#E9F3EC" stroke="#15803D" stroke-width="1.4"/><text x="392.0" y="206" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#1A1A1F" text-anchor="middle">effect 2</text><circle cx="446" cy="202" r="10" fill="#15803D"/><path d="M 442 202 l 2.6 2.8 l 5.4 -6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="400.0" y1="118" x2="400.0" y2="182" stroke="#52525B" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="552" y="182" width="120" height="40" rx="9" fill="#E9F3EC" stroke="#15803D" stroke-width="1.4"/><text x="604.0" y="206" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#1A1A1F" text-anchor="middle">effect 3</text><circle cx="658" cy="202" r="10" fill="#15803D"/><path d="M 654 202 l 2.6 2.8 l 5.4 -6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="612.0" y1="118" x2="612.0" y2="182" stroke="#52525B" stroke-width="1.2" stroke-dasharray="4 3"/><text x="350" y="252" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#52525B" text-anchor="middle">on replay, the flow re-runs but reads the saved checkpoints, so each effect fires once</text></svg>