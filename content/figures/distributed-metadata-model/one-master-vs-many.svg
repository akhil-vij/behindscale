<svg viewBox="0 0 720 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, many clients all query one metadata master; right, clients spread their lookups across a distributed metadata layer"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">ONE MASTER, OR A CLUSTER</text><defs><marker id="r" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#B0752A"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#15803D"/></marker></defs><text x="180" y="46" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#B0752A" text-anchor="middle">one metadata master</text><text x="540" y="46" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">distributed metadata</text><line x1="360" y1="56" x2="360" y2="204" stroke="#E0DCD4" stroke-width="1"/><rect x="30" y="66" width="54" height="26" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1"/><text x="57" y="83" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">client</text><rect x="30" y="110" width="54" height="26" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1"/><text x="57" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">client</text><rect x="30" y="154" width="54" height="26" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1"/><text x="57" y="171" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">client</text><rect x="196" y="88" width="104" height="46" rx="8" fill="#FBF3E7" stroke="#B0752A" stroke-width="1.7"/><text x="248" y="108" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#1A1A1F" text-anchor="middle">one master</text><text x="248" y="122" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle">the bookkeeping</text><line x1="86" y1="79" x2="194" y2="111" stroke="#B0752A" stroke-width="1.4" marker-end="url(#r)"/><line x1="86" y1="123" x2="194" y2="111" stroke="#B0752A" stroke-width="1.4" marker-end="url(#r)"/><line x1="86" y1="167" x2="194" y2="111" stroke="#B0752A" stroke-width="1.4" marker-end="url(#r)"/><text x="180" y="196" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#B0752A" text-anchor="middle">every client hits the one master - it is the bottleneck</text><rect x="388" y="66" width="54" height="26" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1"/><text x="415" y="83" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">client</text><rect x="388" y="110" width="54" height="26" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1"/><text x="415" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">client</text><rect x="388" y="154" width="54" height="26" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1"/><text x="415" y="171" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">client</text><rect x="486" y="60" width="150" height="112" rx="10" fill="#F1F8F3" stroke="#15803D" stroke-width="1.5"/><text x="561" y="76" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">metadata cluster</text><rect x="500" y="84" width="122" height="24" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.1"/><text x="561" y="100" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">front-end</text><rect x="500" y="114" width="122" height="24" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.1"/><text x="561" y="130" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">front-end</text><rect x="500" y="144" width="122" height="24" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.1"/><text x="561" y="160" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">front-end</text><line x1="444" y1="79" x2="498" y2="96" stroke="#15803D" stroke-width="1.4" marker-end="url(#g)"/><line x1="444" y1="123" x2="498" y2="126" stroke="#15803D" stroke-width="1.4" marker-end="url(#g)"/><line x1="444" y1="167" x2="498" y2="156" stroke="#15803D" stroke-width="1.4" marker-end="url(#g)"/><text x="540" y="196" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#15803D" text-anchor="middle">clients spread across many front-ends - it scales out</text><text x="360" y="228" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">a single master answers every client and becomes the ceiling; a distributed layer spreads the lookups, and the bytes go straight to storage</text></svg>