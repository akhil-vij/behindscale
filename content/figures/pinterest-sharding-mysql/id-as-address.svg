<svg viewBox="0 0 700 202" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A 64-bit ID divided into a 16-bit shard field, 10-bit type field, 36-bit row field and 2 spare bits; decoding the example Pin ID gives shard 3429, type Pin, row 7075733, with no lookup service required"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="bah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">ONE 64-BIT ID = SHARD + TYPE + ROW</text>
<rect x="24" y="50" width="163.0" height="42" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="105.5" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">16 bits</text>
<text x="105.5" y="84" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">shard</text>
<rect x="187.0" y="50" width="101.875" height="42" rx="5" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="237.9375" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">10 bits</text>
<text x="237.9375" y="84" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">type</text>
<rect x="288.875" y="50" width="366.75" height="42" rx="5" fill="#FDF3E7" stroke="#B45309" stroke-width="1.3"/>
<text x="472.25" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#B45309" text-anchor="middle" font-weight="700">36 bits</text>
<text x="472.25" y="84" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">row in shard</text>
<rect x="655.625" y="50" width="20.375" height="42" rx="5" fill="#F2F2F4" stroke="#52525B" stroke-width="1.3"/>
<text x="665.8125" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="700">2</text>
<text x="665.8125" y="84" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#52525B" text-anchor="middle" font-weight="400">spare</text>
<text x="24" y="112" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="start" font-weight="700">example: decode the post's real Pin 241294492511762325</text>
<rect x="24" y="124" width="190" height="30" rx="6" fill="#FCFCFD" stroke="#2563EB" stroke-width="1.3"/>
<text x="119" y="143" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="700">shard 3429</text>
<rect x="234" y="124" width="190" height="30" rx="6" fill="#FCFCFD" stroke="#2E7D46" stroke-width="1.3"/>
<text x="329" y="143" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="middle" font-weight="700">type = Pin</text>
<rect x="444" y="124" width="190" height="30" rx="6" fill="#FCFCFD" stroke="#B45309" stroke-width="1.3"/>
<text x="539" y="143" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">row 7075733</text>
<text x="350" y="184" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="400">no lookup service, no hash ring: any client finds any object with a couple of bit shifts</text>
</svg>