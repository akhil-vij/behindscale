<svg viewBox="0 0 700 226" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reading a board: the app first queries the board's shard mapping table for 50 pin IDs (cached in Redis), then fetches each pin object from its own shard (cached in memcache); the join happens in the app, never across shards in the database"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="bah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.4">READING A BOARD: THE APP DOES THE JOIN</text>
<rect x="24" y="86" width="140" height="54" rx="8" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.5"/>
<text x="94" y="110" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="700">the app</text>
<text x="94" y="126" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">runs the join</text>
<rect x="230" y="44" width="210" height="48" rx="7" fill="#FCFCFD" stroke="#2E7D46" stroke-width="1.3"/>
<text x="240" y="62" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="start" font-weight="700">1. board's shard: mapping table</text>
<text x="240" y="80" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="start" font-weight="400">-> a list of 50 pin IDs</text>
<rect x="468" y="48" width="90" height="40" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.2"/>
<text x="513" y="66" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">Redis</text>
<text x="513" y="80" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#52525B" text-anchor="middle" font-weight="400">caches this</text>
<line x1="164" y1="104" x2="230" y2="72" stroke="#2E7D46" stroke-width="1.6" marker-end="url(#gah)"/>
<line x1="440" y1="68" x2="468" y2="68" stroke="#2E7D46" stroke-width="1.4" marker-end="url(#gah)"/>
<rect x="230" y="132" width="210" height="48" rx="7" fill="#FCFCFD" stroke="#2563EB" stroke-width="1.3"/>
<text x="240" y="150" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2563EB" text-anchor="start" font-weight="700">2. each pin's own shard: object</text>
<text x="240" y="168" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="start" font-weight="400">-> the 50 pin JSON objects</text>
<rect x="468" y="136" width="90" height="40" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.2"/>
<text x="513" y="154" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="700">memcache</text>
<text x="513" y="168" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#52525B" text-anchor="middle" font-weight="400">caches these</text>
<line x1="164" y1="122" x2="230" y2="156" stroke="#2563EB" stroke-width="1.6" marker-end="url(#bah)"/>
<line x1="440" y1="156" x2="468" y2="156" stroke="#2563EB" stroke-width="1.4" marker-end="url(#bah)"/>
<text x="350" y="208" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="400">the join happens in the app - the database never reaches across a shard</text>
</svg>