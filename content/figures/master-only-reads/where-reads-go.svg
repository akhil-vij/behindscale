<svg viewBox="0 0 720 246" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, reads spread across primary and replicas, one possibly stale; right, all reads hit the primary, replicas idle"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">WHERE THE READS GO</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#8A8A94"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#7C3AED"/></marker></defs><text x="180" y="44" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#52525B" text-anchor="middle">reading from replicas</text><text x="540" y="44" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle">master-only reads</text><line x1="360" y1="54" x2="360" y2="212" stroke="#E0DCD4" stroke-width="1"/><rect x="34" y="102" width="64" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.1"/><text x="66" y="123" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">app</text><rect x="226" y="64" width="96" height="30" rx="6" fill="#EAF4EC" stroke="#15803D" stroke-width="1.3"/><text x="274" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">primary</text><text x="274" y="89" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#15803D" text-anchor="middle">fresh</text><rect x="226" y="104" width="96" height="30" rx="6" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.3"/><text x="274" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">replica</text><text x="274" y="129" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#8A8A94" text-anchor="middle">in sync</text><rect x="226" y="144" width="96" height="30" rx="6" fill="#FBF3E7" stroke="#B0752A" stroke-width="1.3"/><text x="274" y="158" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">replica</text><text x="274" y="169" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#B0752A" text-anchor="middle">lagging - stale</text><line x1="98" y1="119" x2="224" y2="79" stroke="#8A8A94" stroke-width="1.3" marker-end="url(#a)"/><line x1="98" y1="119" x2="224" y2="119" stroke="#8A8A94" stroke-width="1.3" marker-end="url(#a)"/><line x1="98" y1="119" x2="224" y2="159" stroke="#B0752A" stroke-width="1.3" marker-end="url(#a)"/><text x="180" y="204" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">reads spread out - but a lagging replica can hand back stale data</text><rect x="400" y="102" width="64" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.1"/><text x="432" y="123" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">app</text><rect x="596" y="64" width="96" height="30" rx="6" fill="#F3EEFC" stroke="#7C3AED" stroke-width="1.3"/><text x="644" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">primary</text><text x="644" y="89" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#7C3AED" text-anchor="middle">every read</text><rect x="596" y="104" width="96" height="30" rx="6" fill="#FFFFFF" stroke="#8A8A94" stroke-width="1.3" stroke-dasharray="4 3"/><text x="644" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">replica</text><text x="644" y="129" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#8A8A94" text-anchor="middle">failover only</text><rect x="596" y="144" width="96" height="30" rx="6" fill="#FFFFFF" stroke="#8A8A94" stroke-width="1.3" stroke-dasharray="4 3"/><text x="644" y="158" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">replica</text><text x="644" y="169" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#8A8A94" text-anchor="middle">backup only</text><line x1="464" y1="119" x2="594" y2="79" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#p)"/><text x="540" y="204" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#7C3AED" text-anchor="middle">every read hits the primary - always fresh; replicas are kept for failover</text><text x="360" y="230" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">reading replicas spreads load but risks stale data; sending every read to the primary is always current, at the cost of idle replicas</text></svg>