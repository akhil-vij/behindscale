<svg viewBox="0 0 700 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A self-feeding loop of four states, cache partly empty, scatter query to every shard, database overloaded with timeouts, and refill queries failing, cycling back to empty cache; the paused Consul trigger sits outside and does not touch the loop; the only exits are shedding load or adding capacity"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">WHY STOPPING THE CAUSE DID NOT STOP THE OUTAGE</text>
<rect x="255" y="34" width="190" height="36" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="350" y="56" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">cache partly empty</text>
<rect x="465" y="102" width="190" height="36" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="560" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">scatter query</text>
<text x="560" y="131" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">to every shard</text>
<rect x="255" y="178" width="190" height="36" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="350" y="194" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">database</text>
<text x="350" y="207" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">overloaded, timeouts</text>
<rect x="45" y="102" width="190" height="36" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="140" y="124" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">refill queries fail</text>
<line x1="430" y1="66" x2="470" y2="104" stroke="#DC2626" stroke-width="1.5" marker-end="url(#rah)"/>
<line x1="500" y1="150" x2="440" y2="182" stroke="#DC2626" stroke-width="1.5" marker-end="url(#rah)"/>
<line x1="255" y1="188" x2="205" y2="150" stroke="#DC2626" stroke-width="1.5" marker-end="url(#rah)"/>
<line x1="205" y1="96" x2="290" y2="66" stroke="#DC2626" stroke-width="1.5" marker-end="url(#rah)"/>
<rect x="14" y="44" width="120" height="40" rx="7" fill="#F2F2F4" stroke="#52525B" stroke-width="1.3"/>
<text x="74" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="700">trigger: Consul</text>
<text x="74" y="74" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="700">upgrade PAUSED</text>
<line x1="96" y1="84" x2="150" y2="110" stroke="#52525B" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="120" y="104" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#DC2626" font-weight="700">✗</text>
<text x="74" y="98" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">does not touch the loop</text>
<text x="350" y="238" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">the only exits are external: shed load, or add capacity</text>
</svg>