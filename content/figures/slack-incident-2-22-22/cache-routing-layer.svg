<svg viewBox="0 0 700 228" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Startup requests pass through Mcrouter, which spreads them across the cache servers; Mcrib watches Consul's live list of up machines and swaps in an empty spare whenever a server drops off the list" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="vah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/></marker><marker id="bah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">HOW THE CACHE IN FRONT OF THE DATABASE IS MANAGED</text>
<rect x="20" y="52" width="120" height="38" rx="7" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
<text x="80" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">startup</text>
<text x="80" y="83" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">requests</text>
<line x1="140" y1="71" x2="176" y2="71" stroke="#52525B" stroke-width="1.3" marker-end="url(#fah)"/>
<rect x="178" y="50" width="150" height="42" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="253" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">Mcrouter</text>
<text x="253" y="82" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#1A1A1F" text-anchor="middle" font-weight="400">spreads the requests</text>
<rect x="470" y="46" width="210" height="28" rx="7" fill="#FCFCFD" stroke="#52525B" stroke-width="1.2"/>
<text x="575" y="64" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">Consul: live list of up machines</text>
<rect x="470" y="86" width="210" height="40" rx="7" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="575" y="103" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#7C3AED" text-anchor="middle" font-weight="700">Mcrib</text>
<text x="575" y="117" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#1A1A1F" text-anchor="middle" font-weight="400">picks which servers are in use</text>
<line x1="575" y1="86" x2="575" y2="76" stroke="#7C3AED" stroke-width="1.3" marker-end="url(#vah)"/>
<text x="582" y="82" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#7C3AED" text-anchor="start" font-weight="400">watches</text>
<rect x="150" y="150" width="86" height="34" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="193" y="168" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">cache</text>
<text x="193" y="179" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#52525B" text-anchor="middle" font-weight="700">warm</text>
<line x1="253" y1="93" x2="193" y2="148" stroke="#2563EB" stroke-width="0.9" stroke-dasharray="2 2"/>
<rect x="250" y="150" width="86" height="34" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="293" y="168" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">cache</text>
<text x="293" y="179" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#52525B" text-anchor="middle" font-weight="700">warm</text>
<line x1="253" y1="93" x2="293" y2="148" stroke="#2563EB" stroke-width="0.9" stroke-dasharray="2 2"/>
<rect x="350" y="150" width="86" height="34" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="393" y="168" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">cache</text>
<text x="393" y="179" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#52525B" text-anchor="middle" font-weight="700">warm</text>
<line x1="253" y1="93" x2="393" y2="148" stroke="#2563EB" stroke-width="0.9" stroke-dasharray="2 2"/>
<text x="253" y="138" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="700">across the cache servers</text>
<rect x="462" y="150" width="86" height="34" rx="6" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="505" y="168" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#B45309" text-anchor="middle" font-weight="700">cache</text>
<text x="505" y="179" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#B45309" text-anchor="middle" font-weight="700">empty spare</text>
<line x1="520" y1="126" x2="508" y2="148" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#vah)"/>
<text x="560" y="140" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#7C3AED" text-anchor="start" font-weight="700">swaps in a spare</text>
<text x="350" y="210" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">a server drops off Consul's list, Mcrib swaps in an empty one; during the upgrade, this kept happening</text>
</svg>