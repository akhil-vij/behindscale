<svg viewBox="0 0 700 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, a warm cache where a boot query hits cache and the database does one lookup; right, a cold cache where a miss scatters a query to every shard at once, so database load climbs far faster than the miss rate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">ONE COLD MISS, A QUERY TO EVERY SHARD</text>
<rect x="12" y="38" width="330" height="180" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="28" y="58" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2E7D46" text-anchor="start" font-weight="700">CACHE WARM</text>
<rect x="30" y="74" width="120" height="28" rx="6" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
<text x="90" y="92" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">boot query</text>
<line x1="150" y1="88" x2="186" y2="88" stroke="#2E7D46" stroke-width="1.3" marker-end="url(#gah)"/>
<rect x="188" y="74" width="124" height="28" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="250" y="92" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">cache HIT</text>
<rect x="90" y="150" width="160" height="30" rx="6" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
<text x="170" y="169" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">database: 1 lookup</text>
<line x1="250" y1="102" x2="220" y2="148" stroke="#52525B" stroke-width="1.2" marker-end="url(#fah)"/>
<text x="177" y="205" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="700">the answer is cached; the database barely notices</text>
<rect x="358" y="38" width="330" height="180" rx="10" fill="#FCFCFD" stroke="#DC2626" stroke-width="1.2"/>
<text x="374" y="58" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="start" font-weight="700">CACHE COLD</text>
<rect x="376" y="74" width="110" height="28" rx="6" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
<text x="431" y="92" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">boot query</text>
<line x1="486" y1="88" x2="510" y2="88" stroke="#DC2626" stroke-width="1.3" marker-end="url(#rah)"/>
<rect x="512" y="74" width="96" height="28" rx="6" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="560" y="92" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">cache MISS</text>
<rect x="376" y="150" width="46" height="30" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/>
<text x="399" y="169" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="700">shard1</text>
<line x1="560" y1="102" x2="399" y2="148" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="428" y="150" width="46" height="30" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/>
<text x="451" y="169" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="700">shard2</text>
<line x1="560" y1="102" x2="451" y2="148" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="480" y="150" width="46" height="30" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/>
<text x="503" y="169" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="700">shard3</text>
<line x1="560" y1="102" x2="503" y2="148" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="532" y="150" width="46" height="30" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/>
<text x="555" y="169" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="700">shard4</text>
<line x1="560" y1="102" x2="555" y2="148" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="584" y="150" width="46" height="30" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/>
<text x="607" y="169" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="700">shard5</text>
<line x1="560" y1="102" x2="607" y2="148" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 2"/>
<rect x="636" y="150" width="46" height="30" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/>
<text x="659" y="169" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="700">...</text>
<line x1="560" y1="102" x2="659" y2="148" stroke="#DC2626" stroke-width="1" stroke-dasharray="3 2"/>
<text x="523" y="205" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">one miss scatters a query to every shard at once</text>
<text x="350" y="232" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">as the cache empties, database load climbs far faster than the miss rate</text>
</svg>