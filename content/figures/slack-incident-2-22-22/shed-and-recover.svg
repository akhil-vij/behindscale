<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A tipping-point line: an overloaded plateau, then a throttle that drops load below the line so the cache refills, then a small staircase climbing back, while one too-big jump shoots straight back over the line into relapse"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">BOTH DIRECTIONS ARE CLIFFS</text>
<line x1="56" y1="190" x2="664" y2="190" stroke="#52525B" stroke-width="1.3"/>
<line x1="56" y1="190" x2="56" y2="52" stroke="#52525B" stroke-width="1.3"/>
<text x="50" y="62" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="end" font-weight="400">load</text>
<text x="664" y="204" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="end" font-weight="400">time →</text>
<line x1="56" y1="116" x2="664" y2="116" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="662" y="110" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#DC2626" text-anchor="end" font-weight="700">tipping point</text>
<path d="M56,58 L150,58 L150,158 L232,158 L232,146 L318,146 L318,134 L404,134 L404,122 L474,122" fill="none" stroke="#2E7D46" stroke-width="2"/>
<text x="103" y="50" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">overloaded</text>
<line x1="150" y1="80" x2="150" y2="58" stroke="#52525B" stroke-width="1"/>
<text x="196" y="96" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">throttle: shed new boots</text>
<text x="196" y="108" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">drops load below the line</text>
<text x="330" y="176" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">below the line, the cache refills; then climb in small steps</text>
<path d="M474,122 L508,56" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#rah)"/>
<text x="600" y="74" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">one too-big jump:</text>
<text x="600" y="86" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">straight back over</text>
<text x="350" y="226" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">throttling keeps connected users working; the way back is measured steps, not a jump</text>
</svg>