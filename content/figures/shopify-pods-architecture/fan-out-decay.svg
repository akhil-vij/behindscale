<svg viewBox="0 0 700 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A with_each_shard action fanning out to all shards, failing platform-wide when any one shard is down; and a table showing the action's success chance falling as shards grow, 99.6% at 4, 99.2% at 8, 98.4% at 16"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">WHY EVERY NEW SHARD MADE IT WORSE</text>
<rect x="210" y="38" width="190" height="26" rx="6" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/>
<text x="305" y="55" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">with_each_shard action</text>
<rect x="40" y="110" width="90" height="34" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="85" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">shard 1</text>
<text x="85" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">up</text>
<line x1="305" y1="64" x2="85" y2="108" stroke="#52525B" stroke-width="1.2" marker-end="url(#fah)"/>
<rect x="148" y="110" width="90" height="34" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="193" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">shard 2</text>
<text x="193" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">up</text>
<line x1="305" y1="64" x2="193" y2="108" stroke="#52525B" stroke-width="1.2" marker-end="url(#fah)"/>
<rect x="256" y="110" width="90" height="34" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="301" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">shard 3</text>
<text x="301" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">up</text>
<line x1="305" y1="64" x2="301" y2="108" stroke="#52525B" stroke-width="1.2" marker-end="url(#fah)"/>
<rect x="364" y="110" width="90" height="34" rx="6" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="409" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">shard 4</text>
<text x="409" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">DOWN</text>
<line x1="305" y1="64" x2="409" y2="108" stroke="#DC2626" stroke-width="1.2" marker-end="url(#rah)"/>
<rect x="472" y="110" width="90" height="34" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="517" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">shard 5</text>
<text x="517" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">up</text>
<line x1="305" y1="64" x2="517" y2="108" stroke="#52525B" stroke-width="1.2" marker-end="url(#fah)"/>
<rect x="580" y="110" width="90" height="34" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="625" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">shard 6</text>
<text x="625" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">up</text>
<line x1="305" y1="64" x2="625" y2="108" stroke="#52525B" stroke-width="1.2" marker-end="url(#fah)"/>
<rect x="200" y="160" width="300" height="22" rx="6" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="350" y="175" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">one shard down → the whole action fails platform-wide</text>
<text x="40" y="205" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="start" font-weight="700">CHANCE THE ACTION WORKS (at 99.9% per shard):</text>
<rect x="40" y="214" width="200" height="26" rx="6" fill="#F2F2F4" stroke="#E4E4E7" stroke-width="1"/>
<text x="50" y="231" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="start" font-weight="700">4 shards</text>
<text x="230" y="231" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="end" font-weight="700">99.6%</text>
<rect x="260" y="214" width="200" height="26" rx="6" fill="#F2F2F4" stroke="#E4E4E7" stroke-width="1"/>
<text x="270" y="231" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="start" font-weight="700">8 shards</text>
<text x="450" y="231" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="end" font-weight="700">99.2%</text>
<rect x="480" y="214" width="200" height="26" rx="6" fill="#F2F2F4" stroke="#E4E4E7" stroke-width="1"/>
<text x="490" y="231" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="start" font-weight="700">16 shards</text>
<text x="670" y="231" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="end" font-weight="700">98.4%</text>
<text x="40" y="260" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="start" font-weight="400">more shards → the product of their uptimes keeps falling</text>
</svg>