<svg viewBox="0 0 700 182" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pod's active data center failing, Pod Mover relocating the pod to its paired backup data center in about a minute without dropping requests or jobs, and a note that a whole data center is evacuated pod by pod"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">DISASTER RECOVERY, ONE POD AT A TIME</text>
<rect x="40" y="44" width="220" height="92" rx="10" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="60" y="64" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="start" font-weight="700">ACTIVE DATA CENTER</text>
<text x="60" y="80" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#DC2626" text-anchor="start" font-weight="400">(just failed)</text>
<rect x="70" y="90" width="70" height="34" rx="6" fill="#FCFCFD" stroke="#DC2626" stroke-width="1.3"/>
<text x="105" y="111" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">pod 7</text>
<line x1="268" y1="90" x2="432" y2="90" stroke="#2E7D46" stroke-width="2" marker-end="url(#gah)"/>
<rect x="300" y="68" width="100" height="22" rx="6" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.3"/>
<text x="350" y="83" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#7C3AED" text-anchor="middle" font-weight="700">Pod Mover</text>
<text x="350" y="104" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">~1 min, no dropped</text>
<text x="350" y="115" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">requests or jobs</text>
<rect x="440" y="44" width="220" height="92" rx="10" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="460" y="64" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2E7D46" text-anchor="start" font-weight="700">BACKUP DATA CENTER</text>
<text x="460" y="80" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#2E7D46" text-anchor="start" font-weight="400">(now active)</text>
<rect x="470" y="90" width="70" height="34" rx="6" fill="#FCFCFD" stroke="#2E7D46" stroke-width="1.3"/>
<text x="505" y="111" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">pod 7</text>
<text x="350" y="164" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle" font-weight="700">evacuating a whole data center is just moving its pods out one at a time, which Shopify does daily</text>
</svg>