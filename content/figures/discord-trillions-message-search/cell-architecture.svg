<circle cx="270" cy="172" r="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1"/>
<text x="40" y="202" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="start" font-weight="700">master node runs out of memory</text>
<text x="162" y="236" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">and the biggest index hits Lucene's 2B wall</text>
