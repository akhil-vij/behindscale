<circle cx="638" cy="205" r="7" fill="#FCFCFD" stroke="#7C3AED" stroke-width="1.2"/>
<text x="508" y="236" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#2E7D46" text-anchor="middle" font-weight="700">each cell = a group of small clusters, tuned for its job</text>
