<text x="40" y="122" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="start" font-weight="700">master node runs out of memory</text>
<rect x="28" y="150" width="268" height="62" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="40" y="167" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#DC2626" text-anchor="start" font-weight="700">cluster 2</text>
<text x="40" y="181" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="start" font-weight="400">200+ nodes</text>
<circle cx="150" cy="172" r="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1"/>
<circle cx="170" cy="172" r="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1"/>
