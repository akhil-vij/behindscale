<text x="28" y="54" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="start" font-weight="700">2017: TWO BIG CLUSTERS</text>
<rect x="28" y="70" width="268" height="62" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="40" y="87" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#DC2626" text-anchor="start" font-weight="700">cluster 1</text>
<text x="40" y="101" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="start" font-weight="400">200+ nodes</text>
<circle cx="150" cy="92" r="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1"/>
<circle cx="170" cy="92" r="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1"/>
