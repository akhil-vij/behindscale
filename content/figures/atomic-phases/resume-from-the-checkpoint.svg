<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A four-phase workflow; a crash during phase three; a retry arrow resuming at phase three, not the start"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">RESUME, DO NOT RESTART</text><rect x="28" y="74" width="128" height="46" rx="9" fill="#E9F3EC" stroke="#15803D" stroke-width="1.4"/><text x="92.0" y="102" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1A1A1F" text-anchor="middle">Phase 1</text><text x="92.0" y="136" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#15803D" text-anchor="middle">already done</text><rect x="196" y="74" width="128" height="46" rx="9" fill="#E9F3EC" stroke="#15803D" stroke-width="1.4"/><text x="260.0" y="102" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1A1A1F" text-anchor="middle">Phase 2</text><text x="260.0" y="136" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#15803D" text-anchor="middle">already done</text><rect x="364" y="74" width="128" height="46" rx="9" fill="#FBF3E2" stroke="#B0752A" stroke-width="1.4"/><text x="428.0" y="102" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#1A1A1F" text-anchor="middle">Phase 3</text><text x="428.0" y="136" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#B0752A" text-anchor="middle">resume here</text><rect x="532" y="74" width="128" height="46" rx="9" fill="#FFFFFF" stroke="#D6D2CA" stroke-width="1.4"/><text x="596.0" y="102" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#52525B" text-anchor="middle">Phase 4</text><text x="596.0" y="136" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#8A8A94" text-anchor="middle">then finishes</text><line x1="156" y1="97.0" x2="196" y2="97.0" stroke="#D6D2CA" stroke-width="1.4"/><line x1