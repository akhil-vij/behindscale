<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A bar chart of write share per second: CI tables about 49 percent, everything else about 28 percent, merge requests about 20 percent"><defs><marker id="f_ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A8A94"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">SHARE OF WRITES PER SECOND &#183; WHAT THE DATA SHOWED</text>
<text x="16" y="64" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#1A1A1F" text-anchor="start" font-weight="400">CI tables</text>
<rect x="170" y="46" width="230" height="26" rx="5" fill="#FDF3E7" stroke="#B45309" stroke-width="1.25"/>
<text x="408" y="64" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="start" font-weight="700">~49%</text>
<text x="16" y="106" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#1A1A1F" text-anchor="start" font-weight="400">Everything else</text>
<rect x="170" y="88" width="132" height="26" rx="5" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.25"/>
<text x="310" y="106" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2563EB" text-anchor="start" font-weight="700">~28%</text>
<text x="16" y="148" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#1A1A1F" text-anchor="start" font-weight="400">Merge requests</text>
<rect x="170" y="130" width="94" height="26" rx="5" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.25"/>
<text x="272" y="148" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="start" font-weight="700">~20%</text>
<line x1="405" y1="38" x2="405" y2="164" stroke="#8A8A94" stroke-width="1" stroke-dasharray="3 3"/>
<text x="405" y="178" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="400">half of all writes</text>
<text x="16" y="205" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#1A1A1F" text-anchor="start" font-weight="400">CI alone carried about half the writes, so moving it out roughly halved the load on the original.</text>
</svg>