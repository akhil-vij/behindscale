<svg viewBox="0 0 700 208" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Traffic flows through a per-client rate limiter, then a whole-system load shedder, into the service"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">A STACK OF LAYERS</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52525B"/></marker></defs><rect x="24" y="66" width="96" height="56" rx="10" fill="#F0EEEA" stroke="#52525B" stroke-width="1.5"/><text x="72.0" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">TRAFFIC</text><text x="72.0" y="105" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">all incoming</text><line x1="122" y1="94" x2="150" y2="94" stroke="#52525B" stroke-width="1.6" marker-end="url(#a)"/><rect x="154" y="66" width="150" height="56" rx="10" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.5"/><text x="229.0" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">RATE LIMITER</text><text x="229.0" y="105" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">per client, fires constantly</text><text x="229.0" y="142" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="700">rejects millions / month</text><line x1="306" y1="94" x2="336" y2="94" stroke="#52525B" stroke-width="1.6" marker-end="url(#a)"/><rect x="340" y="66" width="150" height="56" rx="10" fill="#FBF3E2" stroke="#B0752A" stroke-width="1.5"/><text x="415.0" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">LOAD SHEDDER</text><text x="415.0" y="105" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">whole system, fires rarely</text><text x="415.0" y="142" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#B0752A" text-anchor="middle" font-weight="700">rejects ~ hundreds / month</text><line x1="492" y1="94" x2="522" y2="94" stroke="#52525B" stroke-width="1.6" marker-end="url(#a)"/><rect x="526" y="66" width="150" height="56" rx="10" fill="#E9F3EC" stroke="#15803D" stroke-width="1.5"/><text x="601.0" y="90" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">SERVICE</text><text x="601.0" y="105" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">protected</text><text x="350" y="178" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">each layer exists so the next rarely fires - rejections drop by orders of magnitude down the stack</text></svg>