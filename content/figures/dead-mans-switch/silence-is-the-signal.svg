<svg viewBox="0 0 720 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, waiting for a failure signal misses a silent death; right, watching for a missing heartbeat catches it"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">SILENCE IS THE SIGNAL</text><polyline points="60,64 76,64 82,30 90,74 98,64 160,64 176,64 182,30 190,74 198,64 260,64 276,64 282,30 290,74 298,64 360,64 660,64" fill="none" stroke="#B0752A" stroke-width="2"/><line x1="366" y1="64" x2="658" y2="64" stroke="#DC2626" stroke-width="2"/><line x1="362" y1="30" x2="362" y2="92" stroke="#52525B" stroke-width="1" stroke-dasharray="3 3"/><text x="362" y="26" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">the system dies here - silently</text><text x="150" y="90" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#B0752A" text-anchor="middle">heartbeat</text><text x="510" y="90" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle">silence (flatline)</text><rect x="40" y="120" width="300" height="66" rx="9" fill="#FBECEC" stroke="#DC2626" stroke-width="1.5"/><text x="190" y="142" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#1A1A1F" text-anchor="middle">waits for a failure signal</text><text x="190" y="162" font-family="'Inter',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#DC2626" text-anchor="middle">MISSED</text><text x="190" y="177" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">no error ever came - the dead system sent nothing</text><rect x="380" y="120" width="300" height="66" rx="9" fill="#EAF4EC" stroke="#15803D" stroke-width="1.5"/><text x="530" y="142" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#1A1A1F" text-anchor="middle">dead man's switch (watches the beat)</text><text x="530" y="162" font-family="'Inter',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#15803D" text-anchor="middle">ALERT</text><text x="530" y="177" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">the heartbeat stopped - the silence fires it</text><text x="360" y="222" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">a crashed or cut-off system sends no error, so watching for the heartbeat to stop catches what waiting for a failure signal misses</text></svg>