<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Many clients all retry at once against an overloaded server whose capacity has halved, so load multiplies exactly when the server can least handle it, and more failures feed more retries feed more failures"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">ONE RETRY HELPS ONE CLIENT, COSTS THE SHARED SERVER</text>
<rect x="30" y="52" width="86" height="22" rx="5" fill="#F2F2F4" stroke="#52525B" stroke-width="1.1"/>
<text x="73" y="67" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">client</text>
<line x1="116" y1="63" x2="300" y2="120" stroke="#DC2626" stroke-width="1.2"/>
<rect x="30" y="82" width="86" height="22" rx="5" fill="#F2F2F4" stroke="#52525B" stroke-width="1.1"/>
<text x="73" y="97" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">client</text>
<line x1="116" y1="93" x2="300" y2="120" stroke="#DC2626" stroke-width="1.2"/>
<rect x="30" y="112" width="86" height="22" rx="5" fill="#F2F2F4" stroke="#52525B" stroke-width="1.1"/>
<text x="73" y="127" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">client</text>
<line x1="116" y1="123" x2="300" y2="120" stroke="#DC2626" stroke-width="1.2"/>
<rect x="30" y="142" width="86" height="22" rx="5" fill="#F2F2F4" stroke="#52525B" stroke-width="1.1"/>
<text x="73" y="157" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">client</text>
<line x1="116" y1="153" x2="300" y2="120" stroke="#DC2626" stroke-width="1.2"/>
<rect x="30" y="172" width="86" height="22" rx="5" fill="#F2F2F4" stroke="#52525B" stroke-width="1.1"/>
<text x="73" y="187" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">client</text>
<line x1="116" y1="183" x2="300" y2="120" stroke="#DC2626" stroke-width="1.2"/>
<rect x="300" y="86" width="150" height="70" rx="10" fill="#FEECEC" stroke="#DC2626" stroke-width="1.7"/>
<text x="375" y="110" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">SERVER</text>
<text x="375" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">OVERLOADED</text>
<text x="375" y="142" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">(capacity halved)</text>
<text x="210" y="66" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">every client</text>
<text x="210" y="78" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">retries at once</text>
<rect x="500" y="64" width="168" height="34" rx="7" fill="#FDF3E7" stroke="#B45309" stroke-width="1.3"/>
<text x="584" y="85" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#B45309" text-anchor="middle" font-weight="700">more failures</text>
<rect x="500" y="140" width="168" height="34" rx="7" fill="#FDF3E7" stroke="#B45309" stroke-width="1.3"/>
<text x="584" y="161" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#B45309" text-anchor="middle" font-weight="700">more retries</text>
<line x1="560" y1="98" x2="560" y2="138" stroke="#B45309" stroke-width="1.4" marker-end="url(#fah)"/>
<line x1="608" y1="138" x2="608" y2="100" stroke="#B45309" stroke-width="1.4" marker-end="url(#fah)"/>
<line x1="450" y1="120" x2="498" y2="120" stroke="#DC2626" stroke-width="1.3" marker-end="url(#rah)"/>
<text x="474" y="112" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#DC2626" text-anchor="middle" font-weight="400">feeds</text>
<text x="350" y="204" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">a great deal when a few requests fail at random, a storm when the server is already overloaded</text>
</svg>