<svg viewBox="0 0 700 212" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A bucket of retry tokens: while tokens last a client retries freely, and once they run out it retries only at a slow fixed refill rate, so the extra load it can add is capped no matter how long the outage lasts"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">A HARD CAP ON EACH CLIENT'S EXTRA LOAD</text>
<path d="M40,60 L120,60 L112,150 L48,150 Z" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.5"/>
<circle cx="60" cy="130" r="6" fill="#2563EB"/>
<circle cx="78" cy="130" r="6" fill="#2563EB"/>
<circle cx="96" cy="130" r="6" fill="#2563EB"/>
<circle cx="60" cy="112" r="6" fill="#2563EB"/>
<circle cx="78" cy="112" r="6" fill="#2563EB"/>
<circle cx="96" cy="112" r="6" fill="#2563EB"/>
<text x="80" y="172" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#2563EB" text-anchor="middle" font-weight="700">retry tokens</text>
<rect x="170" y="56" width="220" height="40" rx="7" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="280" y="74" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">WHILE TOKENS LAST</text>
<text x="280" y="88" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="400">retry freely, failures fully masked</text>
<line x1="122" y1="80" x2="168" y2="76" stroke="#2E7D46" stroke-width="1.3" marker-end="url(#gah)"/>
<rect x="170" y="116" width="220" height="40" rx="7" fill="#FDF3E7" stroke="#B45309" stroke-width="1.3"/>
<text x="280" y="134" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#B45309" text-anchor="middle" font-weight="700">TOKENS RUN OUT</text>
<text x="280" y="148" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="400">retry only at a slow fixed rate</text>
<line x1="112" y1="130" x2="168" y2="134" stroke="#B45309" stroke-width="1.3" marker-end="url(#fah)"/>
<rect x="420" y="80" width="258" height="54" rx="9" fill="#FCFCFD" stroke="#2E7D46" stroke-width="1.4"/>
<text x="549" y="100" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#2E7D46" text-anchor="middle" font-weight="700">extra load a client can add is</text>
<text x="549" y="114" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">CAPPED, no matter how long</text>
<text x="549" y="127" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#1A1A1F" text-anchor="middle" font-weight="400">the outage lasts</text>
<line x1="390" y1="110" x2="418" y2="108" stroke="#2E7D46" stroke-width="1.3" marker-end="url(#gah)"/>
<text x="350" y="196" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">shipped as the AWS SDK default in 2016, so the safe behavior is the default one</text>
</svg>