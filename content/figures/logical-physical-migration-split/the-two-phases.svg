<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two phases separated by a one-way door: a reversible logical phase, then an irreversible physical phase"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">TWO STEPS, NO RETURN</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52525B"/></marker></defs><rect x="24" y="54" width="286" height="150" rx="11" fill="#E9F3EC" stroke="#15803D" stroke-width="1.6"/><text x="40" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#15803D">LOGICAL STEP</text><text x="40" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#52525B">reversible</text><text x="40" y="120" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F">&#8226; system acts as if the data moved</text><text x="40" y="140" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F">&#8226; revert = config change (seconds)</text><text x="40" y="160" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F">&#8226; ramp + validate under live traffic</text><line x1="330" y1="70" x2="330" y2="188" stroke="#B0752A" stroke-width="2" stroke-dasharray="5 4"/><text x="330" y="46" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#B0752A" text-anchor="middle" font-weight="700">POINT OF NO RETURN</text><line x1="312" y1="129" x2="350" y2="129" stroke="#B0752A" stroke-width="1.8" marker-end="url(#a)"/><rect x="368" y="54" width="308" height="150" rx="11" fill="#FBEBEB" stroke="#DC2626" stroke-width="1.6"/><text x="384" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#DC2626">PHYSICAL STEP</text><text x="384" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#52525B">irreversible</text><text x="384" y="120" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F">&#8226; the data actually moves</text><text x="384" y="140" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F">&#8226; revert = slow and costly</text><text x="384" y="160" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F">&#8226; runs once the new behavior is proven</text><text x="350" y="228" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">do every step you can revert on the left, before the point of no return</text></svg>