<svg viewBox="0 0 700 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chain from a six-minute switch fault to etcd read-only, the manager reading silence as a dead primary, a needless standby promotion, a defect forcing hours of rebuilds, and the login database left alone; the six-minute trigger becomes a six-hour-33-minute impact"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="vah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">SIX MINUTES BECOMES SIX AND A HALF HOURS</text>
<rect x="16" y="50" width="104" height="54" rx="7" fill="#FDF3E7" stroke="#B45309" stroke-width="1.3"/>
<text x="68.0" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#B45309" text-anchor="middle" font-weight="700">6-min switch</text>
<text x="68.0" y="81" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#B45309" text-anchor="middle" font-weight="700">fault</text>
<line x1="120" y1="77" x2="130" y2="77" stroke="#52525B" stroke-width="1.4" marker-end="url(#rah)"/>
<rect x="130" y="50" width="104" height="54" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="182.0" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">etcd goes</text>
<text x="182.0" y="81" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">read-only</text>
<line x1="234" y1="77" x2="244" y2="77" stroke="#52525B" stroke-width="1.4" marker-end="url(#rah)"/>
<rect x="244" y="50" width="118" height="54" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="303.0" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">manager reads</text>
<text x="303.0" y="81" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">silence as a</text>
<text x="303.0" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">dead primary</text>
<line x1="362" y1="77" x2="372" y2="77" stroke="#52525B" stroke-width="1.4" marker-end="url(#rah)"/>
<rect x="372" y="50" width="104" height="54" rx="7" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.3"/>
<text x="424.0" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#7C3AED" text-anchor="middle" font-weight="700">promotes a</text>
<text x="424.0" y="81" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#7C3AED" text-anchor="middle" font-weight="700">standby</text>
<text x="424.0" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#7C3AED" text-anchor="middle" font-weight="700">(needless)</text>
<line x1="476" y1="77" x2="486" y2="77" stroke="#52525B" stroke-width="1.4" marker-end="url(#rah)"/>
<rect x="486" y="50" width="104" height="54" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="538.0" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">defect: every</text>
<text x="538.0" y="81" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">standby rebuilds,</text>
<text x="538.0" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">hours</text>
<line x1="590" y1="77" x2="600" y2="77" stroke="#52525B" stroke-width="1.4" marker-end="url(#rah)"/>
<rect x="600" y="50" width="96" height="54" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="648.0" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">login DB</text>
<text x="648.0" y="81" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">alone,</text>
<text x="648.0" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.8" fill="#DC2626" text-anchor="middle" font-weight="700">overwhelmed</text>
<rect x="16" y="128" width="150" height="30" rx="7" fill="#FDF3E7" stroke="#B45309" stroke-width="1.4"/>
<text x="91" y="148" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">trigger: 6 min</text>
<line x1="166" y1="143" x2="520" y2="143" stroke="#52525B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#rah)"/>
<rect x="520" y="128" width="176" height="30" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="608" y="148" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">impact: 6h 33m</text>
<text x="350" y="180" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">a flawless, needless promotion plus a rebuild defect turned a six-minute blip into a six-hour outage</text>
</svg>