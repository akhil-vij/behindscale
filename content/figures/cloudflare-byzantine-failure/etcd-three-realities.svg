<svg viewBox="0 0 700 274" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three etcd nodes as a triangle: node 1 reaches the leader node 3 only through the broken switch so it votes for itself, node 2 reaches node 3 through a good path and votes for it, the votes tie, and the cluster goes read-only"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="vah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">THREE NODES, THREE VIEWS, NO AGREEMENT</text>
<line x1="170" y1="180" x2="320" y2="92" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4"/>
<text x="230" y="118" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">through the</text>
<text x="230" y="130" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">broken switch</text>
<text x="243" y="150" font-family="'Inter',system-ui,sans-serif" font-size="13" fill="#DC2626" font-weight="700">✗</text>
<line x1="510" y1="180" x2="380" y2="92" stroke="#2E7D46" stroke-width="1.6"/>
<text x="470" y="120" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">good path</text>
<line x1="208" y1="190" x2="482" y2="190" stroke="#2E7D46" stroke-width="1.6"/>
<text x="350" y="205" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">good path (working peer)</text>
<circle cx="350" cy="58" r="34" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.6"/>
<text x="350" y="56" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#7C3AED" text-anchor="middle" font-weight="700">node 3</text>
<text x="350" y="70" font-family="'Inter',system-ui,sans-serif" font-size="7.8" fill="#52525B" text-anchor="middle" font-weight="400">the leader</text>
<circle cx="150" cy="190" r="34" fill="#FEECEC" stroke="#DC2626" stroke-width="1.6"/>
<text x="150" y="188" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">node 1</text>
<text x="150" y="202" font-family="'Inter',system-ui,sans-serif" font-size="7.8" fill="#52525B" text-anchor="middle" font-weight="400">votes for itself</text>
<circle cx="540" cy="190" r="34" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.6"/>
<text x="540" y="188" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="middle" font-weight="700">node 2</text>
<text x="540" y="202" font-family="'Inter',system-ui,sans-serif" font-size="7.8" fill="#52525B" text-anchor="middle" font-weight="400">votes node 3</text>
<rect x="150" y="224" width="400" height="22" rx="6" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="350" y="239" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">votes tie → no leader node 1 can reach → cluster READ-ONLY</text>
<text x="350" y="262" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">RAFT has no way to express a node reachable by some but not others</text>
</svg>