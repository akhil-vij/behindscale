<svg viewBox="0 0 720 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Without a key, a retry double-charges; with the same key, the server replays the first outcome once" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">ONE KEY, ONE CHARGE</text><defs><marker id="r" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#DC2626"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#7C3AED"/></marker></defs><text x="16" y="48" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="700" fill="#DC2626">without a key</text><rect x="30" y="62" width="70" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.1"/><text x="65" y="83" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">client</text><rect x="330" y="56" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/><text x="390" y="74" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">server</text><text x="390" y="87" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle">runs it every time</text><line x1="102" y1="68" x2="328" y2="62" stroke="#DC2626" stroke-width="1.5" marker-end="url(#r)"/><text x="212" y="60" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle">1. charge $50</text><line x1="102" y1="82" x2="328" y2="92" stroke="#DC2626" stroke-width="1.5" marker-end="url(#r)"/><text x="212" y="104" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle">2. retry (reply was lost)</text><rect x="486" y="60" width="210" height="38" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/><text x="591" y="76" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">$100 - charged twice</text><text x="591" y="90" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">each retry looks brand-new</text><text x="16" y="150" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="700" fill="#7C3AED">with a key K</text><rect x="30" y="164" width="70" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.1"/><text x="65" y="185" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">client</text><rect x="330" y="158" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/><text x="390" y="176" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">server</text><text x="390" y="189" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle">sees K, replays result</text><line x1="102" y1="170" x2="328" y2="164" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#p)"/><text x="212" y="162" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#7C3AED" text-anchor="middle">1. charge $50, key K</text><line x1="102" y1="184" x2="328" y2="194" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#p)"/><text x="212" y="206" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#7C3AED" text-anchor="middle">2. retry, key K</text><rect x="486" y="162" width="210" height="38" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="1.4"/><text x="591" y="178" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">$50 - charged once</text><text x="591" y="192" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">the retry replays the saved result</text><text x="360" y="228" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">a stable key lets the server tell a retry from a new request, so the work runs once no matter how many times it is sent</text></svg>