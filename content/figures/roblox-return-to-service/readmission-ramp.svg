<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A staircase rising from 0 to 100 percent in roughly ten steps from hour 61 to hour 73, admitting players via DNS steering against cold caches while checking database load and stability at each step"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">LETTING FIFTY MILLION PLAYERS BACK IN, SLOWLY</text>
<line x1="70" y1="190" x2="630" y2="190" stroke="#52525B" stroke-width="1.4"/>
<line x1="70" y1="190" x2="70" y2="60" stroke="#52525B" stroke-width="1.4"/>
<text x="62" y="66" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#52525B" text-anchor="end" font-weight="400">100%</text>
<text x="62" y="193" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#52525B" text-anchor="end" font-weight="400">0%</text>
<text x="350.0" y="220" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="700">hour 61  →  hour 73  (roughly 10% at each step)</text>
<rect x="70.0" y="177.0" width="53.0" height="13.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<text x="97.0" y="173.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">10%</text>
<rect x="126.0" y="164.0" width="53.0" height="26.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<rect x="182.0" y="151.0" width="53.0" height="39.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<rect x="238.0" y="138.0" width="53.0" height="52.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<rect x="294.0" y="125.0" width="53.0" height="65.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<text x="321.0" y="121.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">50%</text>
<rect x="350.0" y="112.0" width="53.0" height="78.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<rect x="406.0" y="99.0" width="53.0" height="91.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<rect x="462.0" y="86.0" width="53.0" height="104.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<rect x="518.0" y="73.0" width="53.0" height="117.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<rect x="574.0" y="60.0" width="53.0" height="130.0" rx="2" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1"/>
<text x="601.0" y="56.0" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#2E7D46" text-anchor="middle" font-weight="700">100%</text>
<rect x="78" y="56" width="300" height="20" rx="5" fill="#FCFCFD" stroke="#52525B" stroke-width="1.1"/>
<text x="84" y="70" font-family="'Inter',system-ui,sans-serif" font-size="8.8" fill="#52525B" text-anchor="start" font-weight="400">check DB load + cache + stability at each step</text>
<text x="350" y="236" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">a sudden flood would have knocked the barely-healed system back down; the slow ramp was the point</text>
</svg>