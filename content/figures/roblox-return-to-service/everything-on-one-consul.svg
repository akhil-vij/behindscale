<svg viewBox="0 0 700 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A hub and spoke where services, Nomad, Vault, and the monitoring all depend on one Consul cluster; when Consul is unhealthy everything struggles and the monitoring dashboards go dark, leaving the team blind"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">WHY THE OBSERVER WENT DOWN WITH THE OBSERVED</text>
<circle cx="350" cy="140" r="52" fill="#FEECEC" stroke="#DC2626" stroke-width="1.8"/>
<text x="350" y="136" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="700">one Consul</text>
<text x="350" y="151" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="700">cluster</text>
<text x="350" y="166" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">UNHEALTHY</text>
<rect x="50" y="50" width="140" height="42" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="120" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">services</text>
<text x="120" y="83" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">(find each other)</text>
<line x1="188.8805193908778" y1="92" x2="298.3396104568416" y2="124.27727274773441" stroke="#52525B" stroke-width="1.3" marker-end="url(#fah)"/>
<rect x="510" y="50" width="140" height="42" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="580" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">Nomad</text>
<text x="580" y="83" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">(scheduling)</text>
<line x1="511.1194806091222" y1="92" x2="401.6603895431584" y2="124.27727274773441" stroke="#52525B" stroke-width="1.3" marker-end="url(#fah)"/>
<rect x="50" y="190" width="140" height="42" rx="7" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.4"/>
<text x="120" y="208" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">Vault</text>
<text x="120" y="223" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">(secrets)</text>
<line x1="188.8805193908778" y1="188" x2="298.3396104568416" y2="155.72272725226557" stroke="#52525B" stroke-width="1.3" marker-end="url(#fah)"/>
<rect x="510" y="190" width="140" height="42" rx="7" fill="#F2F2F4" stroke="#52525B" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="580" y="208" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#52525B" text-anchor="middle" font-weight="700">MONITORING</text>
<text x="580" y="223" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="middle" font-weight="700">went dark</text>
<line x1="511.1194806091222" y1="188" x2="401.6603895431584" y2="155.72272725226557" stroke="#DC2626" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#rah)"/>
<text x="350" y="256" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">everything depended on the one hub, so the monitoring went dark with everything else</text>
</svg>