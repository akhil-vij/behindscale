<svg viewBox="0 0 700 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two faults: the streaming feature funnels work through a single Go channel so writes back up, and the storage layer writes 7.8MB of bookkeeping per 16kB append; together write latency climbs from 300ms to 2 seconds and the cluster jams"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">TWO FAULTS, ONE SLOW CLUSTER</text>
<rect x="20" y="42" width="320" height="74" rx="9" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="36" y="62" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="start" font-weight="700">BUG 1 · STREAMING</text>
<text x="36" y="80" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#1A1A1F" text-anchor="start" font-weight="400">funnels work through a single one of</text>
<text x="36" y="94" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#1A1A1F" text-anchor="start" font-weight="400">Go's coordination pipes, so under heavy</text>
<text x="36" y="108" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#1A1A1F" text-anchor="start" font-weight="400">reads + writes, writes back up behind it</text>
<rect x="360" y="42" width="320" height="74" rx="9" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="376" y="62" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="start" font-weight="700">BUG 2 · STORAGE (BoltDB)</text>
<text x="376" y="80" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#1A1A1F" text-anchor="start" font-weight="400">writes a 7.8MB bookkeeping list to disk</text>
<text x="376" y="94" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#1A1A1F" text-anchor="start" font-weight="400">for every 16kB of real data, so a 4.2GB</text>
<text x="376" y="108" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#1A1A1F" text-anchor="start" font-weight="400">log holds only 489MB</text>
<line x1="180" y1="116" x2="300" y2="150" stroke="#52525B" stroke-width="1.5" marker-end="url(#rah)"/>
<line x1="520" y1="116" x2="400" y2="150" stroke="#52525B" stroke-width="1.5" marker-end="url(#rah)"/>
<rect x="230" y="152" width="240" height="34" rx="8" fill="#FDF3E7" stroke="#B45309" stroke-width="1.5"/>
<text x="350" y="167" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#B45309" text-anchor="middle" font-weight="700">KV write latency</text>
<text x="350" y="180" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#B45309" text-anchor="middle" font-weight="700">300ms → 2 seconds</text>
<line x1="350" y1="186" x2="350" y2="204" stroke="#DC2626" stroke-width="1.6" marker-end="url(#rah)"/>
<rect x="250" y="206" width="200" height="26" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="350" y="223" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">the cluster jams, platform dark</text>
</svg>