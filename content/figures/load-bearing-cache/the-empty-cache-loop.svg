<svg viewBox="0 0 700 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A four-step loop where an empty cache floods the database, refills fail, and the cache stays empty"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">WHY THE CACHE STAYS EMPTY</text><defs><marker id="r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#DC2626"/></marker></defs><rect x="60" y="46" width="176" height="54" rx="10" fill="#FBECEC" stroke="#DC2626" stroke-width="1.4"/><text x="148.0" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">The cache empties</text><text x="148.0" y="86" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">it stops answering reads</text><rect x="464" y="46" width="176" height="54" rx="10" fill="#FBECEC" stroke="#DC2626" stroke-width="1.4"/><text x="552.0" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Reads flood the database</text><text x="552.0" y="86" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">they fall through</text><rect x="464" y="150" width="176" height="54" rx="10" fill="#FBECEC" stroke="#DC2626" stroke-width="1.4"/><text x="552.0" y="174" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Database overloaded</text><text x="552.0" y="190" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">it starts failing</text><rect x="60" y="150" width="176" height="54" rx="10" fill="#FBECEC" stroke="#DC2626" stroke-width="1.4"/><text x="148.0" y="174" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">Refills fail</text><text x="148.0" y="190" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle">the cache cannot fill back up</text><line x1="240" y1="73.0" x2="458" y2="73.0" stroke="#DC2626" stroke-width="1.6" marker-end="url(#r)"/><line x1="552.0" y1="104" x2="552.0" y2="144" stroke="#DC2626" stroke-width="1.6" marker-end="url(#r)"/><line x1="460" y1="177.0" x2="242" y2="177.0" stroke="#DC2626" stroke-width="1.6" marker-end="url(#r)"/><line x1="148.0" y1="146" x2="148.0" y2="106" stroke="#DC2626" stroke-width="1.6" marker-end="url(#r)"/><text x="350" y="110" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">the loop feeds itself</text><text x="350" y="126" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">the cache never refills</text><text x="350" y="224" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">an empty cache floods the database until it is overloaded, and it then fails the reads that would refill the cache - so it stays empty</text></svg>