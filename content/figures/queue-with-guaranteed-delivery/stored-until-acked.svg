<svg viewBox="0 0 700 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A message flows from producer to a durable queue to a consumer, deleted only after the consumer acknowledges it"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">STORED UNTIL ACKED</text><defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#52525B"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#15803D"/></marker><marker id="aa" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#B0752A"/></marker></defs><rect x="31.0" y="59.0" width="130" height="50" rx="10" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.5"/><text x="96" y="88" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">PRODUCER</text><rect x="275.0" y="56.0" width="150" height="56" rx="10" fill="#E9F3EC" stroke="#15803D" stroke-width="1.5"/><text x="350" y="82" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">DURABLE QUEUE</text><text x="350" y="99" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">saved to disk on arrival</text><rect x="539.0" y="59.0" width="130" height="50" rx="10" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.5"/><text x="604" y="88" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">CONSUMER</text><circle cx="410" cy="66" r="9" fill="#15803D"/><path d="M 406 66 l 2.4 2.6 l 5 -5.6" fill="none" stroke="#FFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><line x1="161" y1="84" x2="273" y2="84" stroke="#52525B" stroke-width="1.6" marker-end="url(#a)"/><text x="217" y="76" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">send</text><line x1="425" y1="84" x2="537" y2="84" stroke="#52525B" stroke-width="1.6" marker-end="url(#a)"/><text x="481" y="76" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">deliver</text><path d="M 604 109 L 604 150" fill="none" stroke="#15803D" stroke-width="1.6" marker-end="url(#ag)"/><text x="614" y="132" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#15803D">ack</text><rect x="524" y="150" width="160" height="30" rx="8" fill="#E9F3EC" stroke="#15803D" stroke-width="1.3"/><text x="604" y="169" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#15803D" text-anchor="middle">only now is it deleted</text><path d="M 560 100 C 470 175, 400 175, 350 113" fill="none" stroke="#B0752A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aa)"/><text x="452" y="192" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#B0752A" text-anchor="middle">crash before ack: redelivered, never lost</text></svg>