<svg viewBox="0 0 700 166" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A six-step timeline; steps one through five form a read-only window of tens of milliseconds during which every write is refused, and step six turns read-only back off so writes resume"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A8A94"/></marker><marker id="rah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.4">THE SIX-STEP CUTOVER: A READ-ONLY WINDOW OF TENS OF MILLISECONDS</text>
<rect x="33.0" y="70" width="100.66666666666667" height="40" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.25"/>
<text x="83.33333333333334" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="700">1</text>
<text x="83.33333333333334" y="101" font-family="'Inter',system-ui,sans-serif" font-size="8.2" fill="#52525B" text-anchor="middle" font-weight="400">read-only ON</text>
<rect x="139.66666666666669" y="70" width="100.66666666666667" height="40" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.25"/>
<text x="190.00000000000003" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="700">2</text>
<text x="190.00000000000003" y="101" font-family="'Inter',system-ui,sans-serif" font-size="8.2" fill="#52525B" text-anchor="middle" font-weight="400">read GTID</text>
<rect x="246.33333333333334" y="70" width="100.66666666666667" height="40" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.25"/>
<text x="296.6666666666667" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="700">3</text>
<text x="296.6666666666667" y="101" font-family="'Inter',system-ui,sans-serif" font-size="8.2" fill="#52525B" text-anchor="middle" font-weight="400">wait: caught up?</text>
<rect x="353.0" y="70" width="100.66666666666667" height="40" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.25"/>
<text x="403.3333333333333" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="700">4</text>
<text x="403.3333333333333" y="101" font-family="'Inter',system-ui,sans-serif" font-size="8.2" fill="#52525B" text-anchor="middle" font-weight="400">stop copy</text>
<rect x="459.6666666666667" y="70" width="100.66666666666667" height="40" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.25"/>
<text x="510.0" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="700">5</text>
<text x="510.0" y="101" font-family="'Inter',system-ui,sans-serif" font-size="8.2" fill="#52525B" text-anchor="middle" font-weight="400">flip routing</text>
<rect x="566.3333333333334" y="70" width="100.66666666666667" height="40" rx="5" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.25"/>
<text x="616.6666666666667" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#2E7D46" text-anchor="middle" font-weight="700">6</text>
<text x="616.6666666666667" y="101" font-family="'Inter',system-ui,sans-serif" font-size="8.2" fill="#52525B" text-anchor="middle" font-weight="400">read-only OFF</text>
<line x1="33" y1="58" x2="560.3333333333334" y2="58" stroke="#DC2626" stroke-width="1.5"/>
<line x1="33" y1="58" x2="33" y2="64" stroke="#DC2626" stroke-width="1.5"/>
<line x1="560.3333333333334" y1="58" x2="560.3333333333334" y2="64" stroke="#DC2626" stroke-width="1.5"/>
<text x="296.6666666666667" y="50" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">READ-ONLY: every write refused (500s) - a window of tens of milliseconds</text>
<text x="616.6666666666667" y="131" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#2E7D46" text-anchor="middle" font-weight="400">writes resume</text>
<text x="30" y="150" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#1A1A1F" text-anchor="start" font-weight="400">Run at the lowest-traffic hour, only a handful of user-facing writes fail.</text>
</svg>