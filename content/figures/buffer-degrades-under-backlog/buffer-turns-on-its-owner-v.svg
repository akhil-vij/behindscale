<svg class="wall-v" viewBox="0 0 360 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A queue fails two ways: it slows as it fills, or one stuck job holds up everything behind it." font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace">
