  <rect x="172" y="129" width="18" height="12" rx="2" fill="#D6D2CA" stroke="#C9C4BA" stroke-width="1"></rect>
  <rect x="192" y="129" width="18" height="12" rx="2" fill="#D6D2CA" stroke="#C9C4BA" stroke-width="1"></rect>
  <rect x="212" y="129" width="18" height="12" rx="2" fill="#D6D2CA" stroke="#C9C4BA" stroke-width="1"></rect>
