  <path d="M 300 236 C 340 220, 340 118, 292 112" fill="none" stroke="#DC2626" stroke-width="1.5"></path>
  <polygon points="284,110 294,106 294,116" fill="#DC2626"></polygon>
  <line x1="180" y1="178" x2="180" y2="188" stroke="#8A8A94" stroke-width="1.3"></line>
  <text x="346" y="248" font-size="13" fill="#DC2626" text-anchor="end" letter-spacing="0.2">gets slower as it fills</text>
  <text x="14" y="230" font-size="13" fill="#DC2626" letter-spacing="0.2">one stuck job holds up the line</text>
  <line x1="150" y1="216" x2="254" y2="150" stroke="#DC2626" stroke-width="1.5"></line>
