  <path d="M 426 52 C 452 12, 352 6, 338 46" fill="none" stroke="#DC2626" stroke-width="1.5"></path>
  <polygon points="334,54 333,44 342,48" fill="#DC2626"></polygon>
  <text x="392" y="18" font-size="12" fill="#DC2626" text-anchor="middle" letter-spacing="0.2">gets slower as it fills</text>
  <line x1="444" y1="90" x2="496" y2="90" stroke="#8A8A94" stroke-width="1.3"></line>
  <polygon points="504,90 496,86 496,94" fill="#8A8A94"></polygon>
