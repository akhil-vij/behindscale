  <rect x="316" y="89" width="18" height="12" rx="2" fill="#D6D2CA" stroke="#C9C4BA" stroke-width="1"></rect>
  <rect x="336" y="89" width="18" height="12" rx="2" fill="#D6D2CA" stroke="#C9C4BA" stroke-width="1"></rect>
