<svg viewBox="0 0 700 152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A timeline of eight operation steps; steps three through six form a red write-downtime band of about seven and a half minutes, reads are down about thirty seconds at the promote step, and the steps before and after are marked zero downtime"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker><marker id="bah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.4">THE OPERATION: WHERE THE DOWNTIME ACTUALLY IS</text>
