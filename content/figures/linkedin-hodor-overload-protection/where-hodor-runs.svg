 <rect x="150" y="18" width="536" height="210" rx="12" fill="#F4F2EE" stroke="#D6D2CA"/>
 <text x="170" y="44" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" letter-spacing="1.5">ONE LINKEDIN SERVICE &#183; ONE PROCESS</text>
