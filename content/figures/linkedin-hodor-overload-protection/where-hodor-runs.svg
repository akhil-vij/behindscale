<svg viewBox="0 0 700 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hodor runs inside each service">
 <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker></defs>
 <text x="14" y="116" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" letter-spacing="1">REQUESTS</text>
