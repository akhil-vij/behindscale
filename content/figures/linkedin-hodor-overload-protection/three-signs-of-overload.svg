<svg viewBox="0 0 700 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three detectors feed one latency confirmation before shedding">
 <defs><marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker></defs>
 <rect x="14" y="20" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#D6D2CA"/><text x="114" y="39" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#1A1A1F" text-anchor="middle">CPU HEARTBEAT</text>
 <text x="14" y="66" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="#52525B">a thread cannot get CPU time</text>
 <rect x="14" y="90" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#D6D2CA"/><text x="114" y="109" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#1A1A1F" text-anchor="middle">GARBAGE COLLECTION</text>
 <text x="14" y="136" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="#52525B">too much time spent cleaning memory</text>
 <rect x="14" y="160" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#D6D2CA"/><text x="114" y="179" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#1A1A1F" text-anchor="middle">THREAD POOL</text>
 <text x="14" y="206" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="#52525B">requests wait too long for a free worker</text>
 <path d="M214,35 C320,35 330,124 424,124" fill="none" stroke="#B8B4AC" stroke-width="1.5"/>
 <path d="M214,105 L424,122" fill="none" stroke="#B8B4AC" stroke-width="1.5"/>
 <path d="M214,175 C320,175 330,126 424,126" fill="none" stroke="#B8B4AC" stroke-width="1.5"/>
 <rect x="426" y="92" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
 <text x="501" y="118" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">LATENCY CHECK</text>
 <text x="501" y="138" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#52525B" text-anchor="middle">rules out false alarms</text>
 <line x1="576" y1="124" x2="600" y2="124" stroke="#52525B" stroke-width="1.5" marker-end="url(#ah2)"/>
 <rect x="604" y="102" width="84" height="44" rx="8" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.5"/>
 <text x="646" y="122" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#2E7D46" text-anchor="middle">SHED</text>
 <text x="646" y="138" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle">lowest first</text>
</svg>
