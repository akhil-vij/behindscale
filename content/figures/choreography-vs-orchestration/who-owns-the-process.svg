<svg viewBox="0 0 720 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, services pass events along with no owner. Right, an engine holds the process and tells each service what to do"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">WHO OWNS THE PROCESS?</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#8A8A94"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 z" fill="#15803D"/></marker></defs><text x="180" y="46" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#52525B" text-anchor="middle">choreography</text><text x="540" y="46" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">orchestration</text><line x1="360" y1="56" x2="360" y2="228" stroke="#E0DCD4" stroke-width="1"/><rect x="22" y="118" width="78" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="61.0" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">orders</text><rect x="141" y="118" width="78" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="180.0" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">payment</text><rect x="260" y="118" width="78" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="299.0" y="139" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">shipping</text><line x1="100" y1="135" x2="139" y2="135" stroke="#8A8A94" stroke-width="1.3" marker-end="url(#a)"/><text x="119.5" y="128" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#8A8A94" text-anchor="middle">event</text><line x1="219" y1="135" x2="258" y2="135" stroke="#8A8A94" stroke-width="1.3" marker-end="url(#a)"/><text x="238.5" y="128" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#8A8A94" text-anchor="middle">event</text><text x="180" y="88" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">each service reacts to the one before it</text><rect x="58" y="172" width="244" height="34" rx="7" fill="#FFFFFF" stroke="#8A8A94" stroke-width="1" stroke-dasharray="4 3"/><text x="180" y="186" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#1A1A1F" text-anchor="middle">"where is order #42?"</text><text x="180" y="199" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#B0752A" text-anchor="middle">no one knows - the process is written down nowhere</text><rect x="436" y="62" width="208" height="40" rx="8" fill="#EAF4EC" stroke="#15803D" stroke-width="1.6"/><text x="540" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" font-weight="700" fill="#1A1A1F" text-anchor="middle">engine</text><text x="540" y="93" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#15803D" text-anchor="middle">1 take order - 2 charge - 3 ship</text><rect x="392" y="140" width="78" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="431.0" y="161" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">orders</text><rect x="501" y="140" width="78" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="540.0" y="161" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">payment</text><rect x="610" y="140" width="78" height="34" rx="7" fill="#F5F5F6" stroke="#8A8A94" stroke-width="1.2"/><text x="649.0" y="161" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" font-weight="700" fill="#1A1A1F" text-anchor="middle">shipping</text><line x1="540" y1="102" x2="431" y2="138" stroke="#15803D" stroke-width="1.2" marker-end="url(#g)"/><line x1="540" y1="102" x2="540" y2="138" stroke="#15803D" stroke-width="1.2" marker-end="url(#g)"/><line x1="540" y1="102" x2="649" y2="138" stroke="#15803D" stroke-width="1.2" marker-end="url(#g)"/><text x="540" y="124" font-family="'Inter',system-ui,sans-serif" font-size="7.5" fill="#15803D" text-anchor="middle">"do your step"</text><rect x="418" y="186" width="244" height="34" rx="7" fill="#FFFFFF" stroke="#15803D" stroke-width="1"/><text x="540" y="200" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#1A1A1F" text-anchor="middle">"where is order #42?"</text><text x="540" y="213" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#15803D" text-anchor="middle">step 2 of 3, waiting on payment</text><text x="360" y="250" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">Choreography has nothing central to fail but cannot say where a process is. Orchestration always can, but every flow depends on the engine.</text></svg>