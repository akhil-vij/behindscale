<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two load charts: without jitter, tall synchronized retry spikes over capacity; with jitter, a low smooth curve under capacity"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">WHY JITTER WORKS</text><rect x="20" y="78" width="300" height="184" rx="10" fill="#FFFFFF" stroke="#D6D2CA" stroke-width="1.2"/><text x="34" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#52525B" font-weight="700">NO JITTER - SYNCHRONIZED</text><line x1="34" y1="232" x2="306" y2="232" stroke="#D6D2CA" stroke-width="1"/><line x1="34" y1="186" x2="306" y2="186" stroke="#B0752A" stroke-width="1.3" stroke-dasharray="5 4"/><text x="306" y="182" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#B0752A" text-anchor="end">server capacity</text><rect x="54.9" y="114.0" width="16.4" height="118.0" rx="2" fill="#DC2626" fill-opacity="0.85"/><rect x="113.2" y="114.0" width="16.4" height="118.0" rx="2" fill="#DC2626" fill-opacity="0.85"/><rect x="190.9" y="114.0" width="16.4" height="118.0" rx="2" fill="#DC2626" fill-opacity="0.85"/><rect x="268.6" y="114.0" width="16.4" height="118.0" rx="2" fill="#DC2626" fill-opacity="0.85"/><text x="170.0" y="266" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">everyone retries together - each wave re-crashes the server</text><rect x="380" y="78" width="300" height="184" rx="10" fill="#FFFFFF" stroke="#D6D2CA" stroke-width="1.2"/><text x="394" y="94" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#52525B" font-weight="700">WITH JITTER - SPREAD OUT</text><line x1="394" y1="232" x2="666" y2="232" stroke="#D6D2CA" stroke-width="1"/><line x1="394" y1="186" x2="666" y2="186" stroke="#B0752A" stroke-width="1.3" stroke-dasharray="5 4"/><text x="666" y="182" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#B0752A" text-anchor="end">server capacity</text><rect x="395.5" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="414.9" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="434.4" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="453.8" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="473.2" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="492.6" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="512.1" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="531.5" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="550.9" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="570.4" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="589.8" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="609.2" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="628.6" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><rect x="648.1" y="206.0" width="16.4" height="26.0" rx="2" fill="#15803D" fill-opacity="0.85"/><text x="530.0" y="266" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">each waits a little differently - the load smooths out</text></svg>