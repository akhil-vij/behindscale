<svg viewBox="0 0 720 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, a workspace rows scattered across shards, a transaction can half-succeed; right, all its rows on one shard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">KEEP RELATED ROWS TOGETHER</text><text x="180" y="44" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#DC2626" text-anchor="middle">scattered by row</text><text x="540" y="44" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">colocated by workspace key</text><line x1="360" y1="54" x2="360" y2="210" stroke="#E0DCD4" stroke-width="1"/><rect x="40" y="72" width="82" height="106" rx="7" fill="#F7F6F4" stroke="#8A8A94" stroke-width="1.1"/><text x="81" y="87" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#8A8A94" text-anchor="middle">shard 1</text><rect x="48" y="98" width="66" height="20" rx="4" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="1"/><text x="81" y="111" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" font-weight="700" fill="#1A1A1F" text-anchor="middle">workspace</text><rect x="138" y="72" width="82" height="106" rx="7" fill="#F7F6F4" stroke="#8A8A94" stroke-width="1.1"/><text x="179" y="87" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#8A8A94" text-anchor="middle">shard 2</text><rect x="146" y="98" width="66" height="20" rx="4" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="1"/><text x="179" y="111" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" font-weight="700" fill="#1A1A1F" text-anchor="middle">document</text><rect x="236" y="72" width="82" height="106" rx="7" fill="#F7F6F4" stroke="#8A8A94" stroke-width="1.1"/><text x="277" y="87" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#8A8A94" text-anchor="middle">shard 3</text><rect x="244" y="98" width="66" height="20" rx="4" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="1"/><text x="277" y="111" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" font-weight="700" fill="#1A1A1F" text-anchor="middle">comment</text><path d="M52 66 L52 60 L312 60 L312 66" fill="none" stroke="#DC2626" stroke-width="1.5"/><text x="182" y="55" font-family="'Inter',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#DC2626" text-anchor="middle">one transaction, three machines</text><text x="180" y="200" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">a delete can succeed on one machine and fail on another - corruption</text><rect x="400" y="72" width="82" height="106" rx="7" fill="#F7F6F4" stroke="#15803D" stroke-width="1.8"/><text x="441" y="87" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#8A8A94" text-anchor="middle">shard 1</text><rect x="408" y="98" width="66" height="20" rx="4" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="1"/><text x="441" y="111" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" font-weight="700" fill="#1A1A1F" text-anchor="middle">workspace</text><rect x="408" y="124" width="66" height="20" rx="4" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="1"/><text x="441" y="137" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" font-weight="700" fill="#1A1A1F" text-anchor="middle">document</text><rect x="408" y="150" width="66" height="20" rx="4" fill="#7C3AED1A" stroke="#7C3AED" stroke-width="1"/><text x="441" y="163" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" font-weight="700" fill="#1A1A1F" text-anchor="middle">comment</text><rect x="498" y="72" width="82" height="106" rx="7" fill="#F7F6F4" stroke="#8A8A94" stroke-width="1.1"/><text x="539" y="87" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#8A8A94" text-anchor="middle">shard 2</text><rect x="506" y="98" width="66" height="20" rx="4" fill="#8A8A941A" stroke="#8A8A94" stroke-width="1"/><text x="539" y="111" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" font-weight="700" fill="#1A1A1F" text-anchor="middle">other ws</text><rect x="596" y="72" width="82" height="106" rx="7" fill="#F7F6F4" stroke="#8A8A94" stroke-width="1.1"/><text x="637" y="87" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" fill="#8A8A94" text-anchor="middle">shard 3</text><rect x="604" y="98" width="66" height="20" rx="4" fill="#8A8A941A" stroke="#8A8A94" stroke-width="1"/><text x="637" y="111" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8" font-weight="700" fill="#1A1A1F" text-anchor="middle">other ws</text><path d="M410 66 L410 60 L472 60 L472 66" fill="none" stroke="#15803D" stroke-width="1.5"/><text x="441" y="55" font-family="'Inter',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#15803D" text-anchor="middle">one transaction, one machine</text><text x="540" y="200" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle">the whole workspace lives on one machine - transactions are safe</text><text x="360" y="228" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">sharding related rows apart lets a transaction half-fail; sharding them all by the same key keeps each entity on one machine</text></svg>