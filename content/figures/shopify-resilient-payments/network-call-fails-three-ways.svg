<svg viewBox="0 0 700 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three ways a network call fails; only the first is safe to retry">
 <!-- CASE 1 -->
 <text x="16" y="44" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">CASE 1</text>
 <rect x="72" y="27" width="66" height="26" rx="5" fill="#F4F2EE" stroke="#D6D2CA"/><text x="105" y="44" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">CLIENT</text>
 <line x1="138" y1="40" x2="430" y2="40" stroke="#D6D2CA" stroke-width="1.5"/>
 <line x1="243" y1="33" x2="257" y2="47" stroke="#E5484D" stroke-width="2.25"/><line x1="257" y1="33" x2="243" y2="47" stroke="#E5484D" stroke-width="2.25"/>
 <rect x="430" y="27" width="66" height="26" rx="5" fill="#F4F2EE" stroke="#D6D2CA"/><text x="463" y="44" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">SERVER</text>
 <rect x="520" y="27" width="156" height="26" rx="6" fill="#EAF6EE" stroke="#2E7D46"/><text x="598" y="44" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#2E7D46" text-anchor="middle">SAFE TO RETRY</text>
 <text x="72" y="68" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="#52525B">The request never arrived. Nothing happened - retry freely.</text>
 <!-- CASE 2 -->
 <text x="16" y="120" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">CASE 2</text>
 <rect x="72" y="103" width="66" height="26" rx="5" fill="#F4F2EE" stroke="#D6D2CA"/><text x="105" y="120" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">CLIENT</text>
 <line x1="138" y1="116" x2="430" y2="116" stroke="#D6D2CA" stroke-width="1.5"/>
 <line x1="405" y1="109" x2="419" y2="123" stroke="#E5484D" stroke-width="2.25"/><line x1="419" y1="109" x2="405" y2="123" stroke="#E5484D" stroke-width="2.25"/>
 <rect x="430" y="103" width="66" height="26" rx="5" fill="#F4F2EE" stroke="#D6D2CA"/><text x="463" y="120" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">SERVER</text>
 <rect x="520" y="103" width="156" height="26" rx="6" fill="#FDF3E7" stroke="#B45309"/><text x="598" y="120" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">AMBIGUOUS</text>
 <text x="72" y="144" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="#52525B">It failed while the server was working. Done, or not?</text>
 <!-- CASE 3 -->
 <text x="16" y="196" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">CASE 3</text>
 <rect x="72" y="179" width="66" height="26" rx="5" fill="#F4F2EE" stroke="#D6D2CA"/><text x="105" y="196" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">CLIENT</text>
 <line x1="138" y1="192" x2="430" y2="192" stroke="#D6D2CA" stroke-width="1.5"/>
 <path d="M403,192 l6,7 l12,-14" fill="none" stroke="#2E7D46" stroke-width="2.25"/>
 <rect x="430" y="179" width="66" height="26" rx="5" fill="#F4F2EE" stroke="#D6D2CA"/><text x="463" y="196" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle">SERVER</text>
 <rect x="520" y="179" width="156" height="26" rx="6" fill="#FDF3E7" stroke="#B45309"/><text x="598" y="196" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" font-weight="700" fill="#B45309" text-anchor="middle">AMBIGUOUS</text>
 <text x="72" y="220" font-family="'Inter',system-ui,sans-serif" font-size="11.5" fill="#52525B">The work finished - the response died on the way back.</text>
</svg>
