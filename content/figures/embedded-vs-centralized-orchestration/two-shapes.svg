<svg viewBox="0 0 700 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two topologies: embedded, with orchestration inside each service; centralized, with all services calling one shared cluster"><text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#8A8A94" letter-spacing="0.5">TWO SHAPES</text><rect x="20" y="40" width="316" height="196" rx="10" fill="#FFFFFF" stroke="#D6D2CA" stroke-width="1.2"/><text x="34" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#52525B" font-weight="700">EMBEDDED</text><rect x="36" y="76" width="84" height="74" rx="8" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="78" y="94" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#1A1A1F" text-anchor="middle">Service A</text><rect x="50" y="104" width="56" height="34" rx="6" fill="#E9F3EC" stroke="#15803D" stroke-width="1.3"/><text x="78" y="124" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#15803D" text-anchor="middle">orch lib</text><rect x="132" y="76" width="84" height="74" rx="8" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="174" y="94" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#1A1A1F" text-anchor="middle">Service B</text><rect x="146" y="104" width="56" height="34" rx="6" fill="#E9F3EC" stroke="#15803D" stroke-width="1.3"/><text x="174" y="124" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#15803D" text-anchor="middle">orch lib</text><rect x="228" y="76" width="84" height="74" rx="8" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="270" y="94" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#1A1A1F" text-anchor="middle">Service C</text><rect x="242" y="104" width="56" height="34" rx="6" fill="#E9F3EC" stroke="#15803D" stroke-width="1.3"/><text x="270" y="124" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#15803D" text-anchor="middle">orch lib</text><text x="178" y="178" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">coordination lives inside each service</text><text x="178" y="192" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#15803D" text-anchor="middle">a failure stays local; no shared infra</text><rect x="364" y="40" width="316" height="196" rx="10" fill="#FFFFFF" stroke="#D6D2CA" stroke-width="1.2"/><text x="378" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#52525B" font-weight="700">CENTRALIZED</text><rect x="386" y="72" width="76" height="34" rx="7" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="424" y="93" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="600" fill="#1A1A1F" text-anchor="middle">Service A</text><line x1="424" y1="106" x2="522" y2="150" stroke="#52525B" stroke-width="1.2"/><rect x="470" y="72" width="76" height="34" rx="7" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="508" y="93" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="600" fill="#1A1A1F" text-anchor="middle">Service B</text><line x1="508" y1="106" x2="522" y2="150" stroke="#52525B" stroke-width="1.2"/><rect x="554" y="72" width="76" height="34" rx="7" fill="#EAF0FB" stroke="#2563EB" stroke-width="1.4"/><text x="592" y="93" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="600" fill="#1A1A1F" text-anchor="middle">Service C</text><line x1="592" y1="106" x2="522" y2="150" stroke="#52525B" stroke-width="1.2"/><rect x="410" y="150" width="224" height="34" rx="8" fill="#F1EBFB" stroke="#7C3AED" stroke-width="1.6"/><text x="522" y="171" font-family="'Inter',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle">ORCHESTRATOR CLUSTER</text><text x="522" y="204" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle">every service calls one shared cluster</text><text x="522" y="218" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#7C3AED" text-anchor="middle">easy to coordinate; one shared dependency</text></svg>