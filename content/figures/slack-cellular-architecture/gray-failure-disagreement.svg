<svg viewBox="0 0 700 234" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A flapping link in zone 2; a machine inside zone 2 sees its own zone healthy and the outside down, a machine outside sees zone 2 down, and two clients in zone 2 disagree, so no two components agree a failure exists"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">WHY AUTOMATIC DETECTION COULD NOT CONVERGE</text>
<rect x="60" y="38" width="170" height="34" rx="7" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="74" y="59" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="start" font-weight="700">zone 1</text>
<rect x="270" y="38" width="170" height="34" rx="7" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="284" y="59" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="start" font-weight="700">zone 2</text>
<text x="420" y="59" font-family="'Inter',system-ui,sans-serif" font-size="14" fill="#DC2626" text-anchor="end" font-weight="400">⚡</text>
<line x1="340" y1="72" x2="370" y2="72" stroke="#DC2626" stroke-width="2" stroke-dasharray="2 3"/>
<text x="390" y="59" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#DC2626" text-anchor="end" font-weight="400">link flapping</text>
<rect x="480" y="38" width="170" height="34" rx="7" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="494" y="59" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="start" font-weight="700">zone 3</text>
<text x="24" y="107" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#1A1A1F" text-anchor="start" font-weight="700">A machine INSIDE zone 2 sees</text>
<rect x="300" y="92" width="86" height="22" rx="5" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.2"/><text x="343" y="107" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">its zone: OK</text>
<rect x="400" y="92" width="86" height="22" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/><text x="443" y="107" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">outside: DOWN</text>
<text x="24" y="141" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#1A1A1F" text-anchor="start" font-weight="700">A machine OUTSIDE sees</text>
<rect x="300" y="126" width="86" height="22" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/><text x="343" y="141" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">zone 2: DOWN</text>
<text x="24" y="175" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#1A1A1F" text-anchor="start" font-weight="700">Two clients IN zone 2 see</text>
<rect x="300" y="160" width="86" height="22" rx="5" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.2"/><text x="343" y="175" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#2E7D46" text-anchor="middle" font-weight="700">client A: OK</text>
<rect x="400" y="160" width="86" height="22" rx="5" fill="#FEECEC" stroke="#DC2626" stroke-width="1.2"/><text x="443" y="175" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">client B: DOWN</text>
<rect x="120" y="200" width="460" height="24" rx="6" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
<text x="350" y="216" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#1A1A1F" text-anchor="middle" font-weight="700">no two agree a failure exists, so automatic detection cannot act</text>
</svg>