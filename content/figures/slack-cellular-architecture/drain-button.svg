<svg viewBox="0 0 700 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Edge load balancers in other regions splitting traffic across three zones by weight; draining zone 2 sets its weight to zero so new requests go to zones 1 and 3 while in-flight requests finish"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">THE DRAIN BUTTON: REWEIGHT A ZONE TO ZERO</text>
<rect x="230" y="38" width="240" height="30" rx="7" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="350" y="52" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#7C3AED" text-anchor="middle" font-weight="700">edge load balancers</text>
<text x="350" y="63" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#8A8A94" text-anchor="middle" font-weight="400">(in other regions)</text>
<rect x="60" y="120" width="170" height="70" rx="8" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="145" y="142" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="middle" font-weight="700">zone 1</text>
<text x="145" y="160" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">33% → 50%</text>
<text x="145" y="178" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">takes the extra load</text>
<line x1="350" y1="68" x2="145" y2="118" stroke="#2E7D46" stroke-width="1.6" marker-end="url(#gah)"/>
<rect x="270" y="120" width="170" height="70" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="355" y="142" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">zone 2</text>
<text x="355" y="160" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">34% → 0%</text>
<text x="355" y="178" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">draining: in-flight finish</text>
<line x1="350" y1="68" x2="355" y2="118" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#rah)"/>
<rect x="480" y="120" width="170" height="70" rx="8" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="565" y="142" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="middle" font-weight="700">zone 3</text>
<text x="565" y="160" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">33% → 50%</text>
<text x="565" y="178" font-family="'Inter',system-ui,sans-serif" font-size="8" fill="#52525B" text-anchor="middle" font-weight="400">takes the extra load</text>
<line x1="350" y1="68" x2="565" y2="118" stroke="#2E7D46" stroke-width="1.6" marker-end="url(#gah)"/>
<text x="350" y="214" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle" font-weight="700">set zone 2 to zero: new requests go to zones 1 and 3, in-flight finish, nothing dropped</text>
<text x="350" y="230" font-family="'Inter',system-ui,sans-serif" font-size="9.5" fill="#52525B" text-anchor="middle" font-weight="700">takes seconds · 1% steps · needs nothing inside zone 2</text>
</svg>