<svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A faulty chip computes a wrong answer but reports success and passes every health check, the wrong result flows downstream across services and surfaces weeks later as an application bug, with a broken arrow showing no trace points back to the chip"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">THE FAILURE THAT LEAVES NO TRACE</text>
<rect x="20" y="50" width="150" height="54" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="95" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">faulty chip</text>
<text x="95" y="86" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">2 + 2 = 5</text>
<text x="95" y="98" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">...but reports OK</text>
<line x1="170" y1="77" x2="206" y2="77" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<rect x="208" y="50" width="150" height="54" rx="8" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.4"/>
<text x="283" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="middle" font-weight="700">reports SUCCESS</text>
<text x="283" y="83" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">every health check</text>
<text x="283" y="95" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#2E7D46" text-anchor="middle" font-weight="700">stays green</text>
<line x1="358" y1="77" x2="394" y2="77" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<rect x="396" y="50" width="140" height="54" rx="8" fill="#F2F2F4" stroke="#52525B" stroke-width="1.3"/>
<text x="466" y="70" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#1A1A1F" text-anchor="middle" font-weight="700">wrong result</text>
<text x="466" y="85" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">flows across</text>
<text x="466" y="97" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">services</text>
<line x1="536" y1="77" x2="572" y2="77" stroke="#52525B" stroke-width="1.4" marker-end="url(#rah)"/>
<rect x="574" y="50" width="110" height="54" rx="8" fill="#FEECEC" stroke="#DC2626" stroke-width="1.4"/>
<text x="629" y="68" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" fill="#DC2626" text-anchor="middle" font-weight="700">weeks later:</text>
<text x="629" y="82" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">application</text>
<text x="629" y="95" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#DC2626" text-anchor="middle" font-weight="700">bug</text>
<path d="M574,120 C400,150 260,150 100,118" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#rah)"/>
<text x="345" y="162" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#DC2626" text-anchor="middle" font-weight="700">no trace points back to the chip that caused it</text>
<line x1="333" y1="140" x2="357" y2="128" stroke="#DC2626" stroke-width="2"/>
<text x="345" y="192" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">nothing about the failure is ever visible at the source</text>
</svg>