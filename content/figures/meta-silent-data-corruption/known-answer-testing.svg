<svg viewBox="0 0 700 234" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, the questions health checks ask (up, responsive, cool, errors) all answer green but none asks whether the answer is correct; right, a known-answer test sends a known input, gets a wrong answer back, and that mismatch is the detection"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">MANUFACTURE THE EVIDENCE</text>
<rect x="14" y="40" width="330" height="180" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="30" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#52525B" text-anchor="start" font-weight="700">WHAT HEALTH CHECKS ASK</text>
<text x="36" y="78" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#2E7D46" text-anchor="start" font-weight="400">●</text>
<text x="54" y="78" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F" text-anchor="start" font-weight="400">is it up?</text>
<text x="320" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="end" font-weight="700">green</text>
<text x="36" y="102" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#2E7D46" text-anchor="start" font-weight="400">●</text>
<text x="54" y="102" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F" text-anchor="start" font-weight="400">is it responsive?</text>
<text x="320" y="102" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="end" font-weight="700">green</text>
<text x="36" y="126" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#2E7D46" text-anchor="start" font-weight="400">●</text>
<text x="54" y="126" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F" text-anchor="start" font-weight="400">is it cool?</text>
<text x="320" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="end" font-weight="700">green</text>
<text x="36" y="150" font-family="'Inter',system-ui,sans-serif" font-size="11" fill="#2E7D46" text-anchor="start" font-weight="400">●</text>
<text x="54" y="150" font-family="'Inter',system-ui,sans-serif" font-size="10.5" fill="#1A1A1F" text-anchor="start" font-weight="400">any errors logged?</text>
<text x="320" y="150" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" fill="#2E7D46" text-anchor="end" font-weight="700">green</text>
<rect x="30" y="180" width="298" height="28" rx="6" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
<text x="179" y="198" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">none asks: is the answer correct?</text>
<rect x="356" y="40" width="330" height="180" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="372" y="60" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#7C3AED" text-anchor="start" font-weight="700">WHAT A KNOWN-ANSWER TEST ASKS</text>
<rect x="378" y="74" width="286" height="30" rx="6" fill="#EEF3FE" stroke="#2563EB" stroke-width="1.3"/>
<text x="521" y="93" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2563EB" text-anchor="middle" font-weight="700">you send an input you know: 2 + 2</text>
<line x1="521" y1="104" x2="521" y2="120" stroke="#52525B" stroke-width="1.4" marker-end="url(#fah)"/>
<rect x="378" y="122" width="286" height="30" rx="6" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="521" y="141" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="middle" font-weight="700">the chip answers 5</text>
<line x1="521" y1="152" x2="521" y2="168" stroke="#DC2626" stroke-width="1.5" marker-end="url(#rah)"/>
<rect x="378" y="170" width="286" height="34" rx="7" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.4"/>
<text x="521" y="185" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#7C3AED" text-anchor="middle" font-weight="700">MISMATCH = caught</text>
<text x="521" y="198" font-family="'Inter',system-ui,sans-serif" font-size="8.5" fill="#52525B" text-anchor="middle" font-weight="400">the one symptom this failure ever gives</text>
</svg>