<svg viewBox="0 0 700 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left, in-platform monitoring where a platform outage sends the alert stream to zero, quiet not red, so no one is paged; right, an outside watcher that stays up, checks the platform like a customer, sees it is down and pages at 06:08"><defs><marker id="fah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#52525B"/></marker><marker id="rah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/></marker><marker id="gah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E7D46"/></marker></defs>
<text x="16" y="22" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#8A8A94" text-anchor="start" font-weight="400" letter-spacing="0.5">A DYING MONITOR GOES QUIET, NOT RED</text>
<rect x="12" y="38" width="330" height="180" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="28" y="58" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="start" font-weight="700">MONITORING ON THE PLATFORM</text>
<rect x="60" y="74" width="234" height="30" rx="6" fill="#FEECEC" stroke="#DC2626" stroke-width="1.3"/>
<text x="177" y="93" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#DC2626" text-anchor="middle" font-weight="700">platform is down</text>
<line x1="177" y1="104" x2="177" y2="124" stroke="#52525B" stroke-width="1.3" marker-end="url(#fah)"/>
<rect x="60" y="126" width="234" height="34" rx="6" fill="#F2F2F4" stroke="#52525B" stroke-width="1.3"/>
<text x="177" y="142" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#1A1A1F" text-anchor="middle" font-weight="700">alert stream: 0 alerts</text>
<text x="177" y="155" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">quiet, not red</text>
<rect x="60" y="176" width="234" height="26" rx="6" fill="#F2F2F4" stroke="#52525B" stroke-width="1.2"/>
<text x="177" y="193" font-family="'Inter',system-ui,sans-serif" font-size="10" fill="#52525B" text-anchor="middle" font-weight="700">silence looks like health: no page</text>
<rect x="358" y="38" width="330" height="180" rx="10" fill="#FCFCFD" stroke="#E4E4E7" stroke-width="1"/>
<text x="374" y="58" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2E7D46" text-anchor="start" font-weight="700">WATCHER OUTSIDE THE WALLS</text>
<rect x="406" y="74" width="234" height="30" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="523" y="93" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2E7D46" text-anchor="middle" font-weight="700">outside watcher: up</text>
<text x="523" y="118" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#52525B" text-anchor="middle" font-weight="400">checks the platform like a customer</text>
<line x1="523" y1="124" x2="523" y2="140" stroke="#2E7D46" stroke-width="1.4" marker-end="url(#gah)"/>
<rect x="406" y="142" width="234" height="30" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="523" y="161" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10.5" fill="#2E7D46" text-anchor="middle" font-weight="700">sees it is down → fires</text>
<rect x="406" y="178" width="234" height="26" rx="6" fill="#EAF6EE" stroke="#2E7D46" stroke-width="1.3"/>
<text x="523" y="195" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11" fill="#2E7D46" text-anchor="middle" font-weight="700">PAGED at 06:08</text>
</svg>